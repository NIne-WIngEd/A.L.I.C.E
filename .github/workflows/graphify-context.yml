name: Graphify Context Substrate

on:
  push:
    branches:
      - research/graphify-context-substrate
    paths-ignore:
      - "graphify-out/**"
      - "research/graphify-context/**"
      - ".github/workflows/graphify-context.yml"
      - ".github/workflows/graphify-query.yml"
      - ".github/workflows/graphify-sync.yml"
      - ".github/workflows/context-catalog.yml"
      - "scripts/context/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  GRAPHIFY_SOURCE_BRANCH: alice-eipm-v1-build

jobs:
  build-code-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source branch freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/$GRAPHIFY_SOURCE_BRANCH:refs/remotes/origin/$GRAPHIFY_SOURCE_BRANCH"
          SOURCE_COMMIT="$(git rev-parse "origin/$GRAPHIFY_SOURCE_BRANCH")"
          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD; then
            echo "STALE_RESEARCH_BRANCH: $GRAPHIFY_SOURCE_BRANCH at $SOURCE_COMMIT is not contained in $GITHUB_SHA"
            echo "Run the Graphify source-sync workflow before rebuilding."
            exit 2
          fi
          echo "GRAPHIFY_SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          SOURCE_DIR="$RUNNER_TEMP/alice-graph-source"
          rm -rf "$SOURCE_DIR"
          git worktree add --detach "$SOURCE_DIR" "origin/$GRAPHIFY_SOURCE_BRANCH"
          echo "GRAPHIFY_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphify
        run: |
          python -m pip install --upgrade pip
          python -m pip install graphifyy

      - name: Build deterministic code graph from exact source worktree
        shell: bash
        run: |
          set -euo pipefail
          cd "$GRAPHIFY_SOURCE_DIR"
          graphify extract . --code-only

      - name: Record source state
        shell: bash
        run: |
          mkdir -p research/graphify-context
          {
            echo "{"
            echo "  \"source_work_branch\": \"$GRAPHIFY_SOURCE_BRANCH\","
            echo "  \"source_work_commit\": \"$GRAPHIFY_SOURCE_COMMIT\","
            echo "  \"research_branch\": \"$GITHUB_REF_NAME\","
            echo "  \"research_commit\": \"$GITHUB_SHA\","
            echo "  \"workflow_run_id\": \"$GITHUB_RUN_ID\","
            echo "  \"graph_mode\": \"code-only\","
            echo "  \"extraction_tree\": \"exact-source-worktree\","
            echo "  \"authority\": \"navigation-only\""
            echo "}"
          } > research/graphify-context/LAST_GRAPH_BUILD.json

      - name: Publish graph on latest research head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "alice-context-graph-bot"
          git config user.email "actions@users.noreply.github.com"

          TMP_DIR="$(mktemp -d)"
          cp "$GRAPHIFY_SOURCE_DIR/graphify-out/graph.json" "$TMP_DIR/graph.json"
          cp research/graphify-context/LAST_GRAPH_BUILD.json "$TMP_DIR/LAST_GRAPH_BUILD.json"
          if [ -f "$GRAPHIFY_SOURCE_DIR/graphify-out/GRAPH_REPORT.md" ]; then
            cp "$GRAPHIFY_SOURCE_DIR/graphify-out/GRAPH_REPORT.md" "$TMP_DIR/GRAPH_REPORT.md"
          fi

          git fetch origin             "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"             "+refs/heads/$GRAPHIFY_SOURCE_BRANCH:refs/remotes/origin/$GRAPHIFY_SOURCE_BRANCH"

          LIVE_SOURCE_COMMIT="$(git rev-parse "origin/$GRAPHIFY_SOURCE_BRANCH")"
          if [ "$LIVE_SOURCE_COMMIT" != "$GRAPHIFY_SOURCE_COMMIT" ]; then
            echo "SOURCE_MOVED_DURING_BUILD: built $GRAPHIFY_SOURCE_COMMIT but live source is $LIVE_SOURCE_COMMIT"
            exit 3
          fi

          git reset --hard "origin/$GITHUB_REF_NAME"

          if ! git merge-base --is-ancestor "$LIVE_SOURCE_COMMIT" HEAD; then
            echo "RESEARCH_HEAD_STALE_AFTER_REFRESH: live source is not contained in latest research head"
            exit 4
          fi

          mkdir -p graphify-out research/graphify-context
          cp "$TMP_DIR/graph.json" graphify-out/graph.json
          cp "$TMP_DIR/LAST_GRAPH_BUILD.json" research/graphify-context/LAST_GRAPH_BUILD.json
          if [ -f "$TMP_DIR/GRAPH_REPORT.md" ]; then
            cp "$TMP_DIR/GRAPH_REPORT.md" graphify-out/GRAPH_REPORT.md
          fi

          git add graphify-out/graph.json research/graphify-context/LAST_GRAPH_BUILD.json
          if [ -f graphify-out/GRAPH_REPORT.md ]; then
            git add graphify-out/GRAPH_REPORT.md
          fi

          if git diff --cached --quiet; then
            echo "No graph changes."
            exit 0
          fi

          git commit -m "research: refresh Graphify context graph"
          git push origin "HEAD:$GITHUB_REF_NAME"
