name: Graphify Context Substrate

on:
  push:
    branches:
      - research/graphify-context-substrate
    paths-ignore:
      - "graphify-out/**"
      - "research/graphify-context/**"
      - ".github/workflows/graphify-context.yml"
      - ".github/workflows/graphify-query.yml"
      - ".github/workflows/graphify-sync.yml"
      - "scripts/context/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  GRAPHIFY_SOURCE_BRANCH: alice-eipm-v1-build

jobs:
  build-code-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source branch freshness
        shell: bash
        run: |
          git fetch origin "$GRAPHIFY_SOURCE_BRANCH"
          SOURCE_COMMIT="$(git rev-parse "origin/$GRAPHIFY_SOURCE_BRANCH")"
          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD; then
            echo "STALE_RESEARCH_BRANCH: $GRAPHIFY_SOURCE_BRANCH at $SOURCE_COMMIT is not contained in $GITHUB_SHA"
            echo "Run the Graphify source-sync workflow before rebuilding."
            exit 2
          fi
          echo "GRAPHIFY_SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphify
        run: |
          python -m pip install --upgrade pip
          python -m pip install graphifyy

      - name: Build deterministic code graph
        run: |
          graphify extract . --code-only

      - name: Record source state
        shell: bash
        run: |
          mkdir -p research/graphify-context
          {
            echo "{"
            echo "  \"source_work_branch\": \"$GRAPHIFY_SOURCE_BRANCH\","
            echo "  \"source_work_commit\": \"$GRAPHIFY_SOURCE_COMMIT\","
            echo "  \"research_branch\": \"$GITHUB_REF_NAME\","
            echo "  \"research_commit\": \"$GITHUB_SHA\","
            echo "  \"workflow_run_id\": \"$GITHUB_RUN_ID\","
            echo "  \"graph_mode\": \"code-only\","
            echo "  \"authority\": \"navigation-only\""
            echo "}"
          } > research/graphify-context/LAST_GRAPH_BUILD.json

      - name: Commit persistent context artifacts
        shell: bash
        run: |
          git config user.name "alice-context-graph-bot"
          git config user.email "actions@users.noreply.github.com"

          git add graphify-out/graph.json
          if [ -f graphify-out/GRAPH_REPORT.md ]; then
            git add graphify-out/GRAPH_REPORT.md
          fi
          git add research/graphify-context/LAST_GRAPH_BUILD.json

          if git diff --cached --quiet; then
            echo "No graph changes."
            exit 0
          fi

          git commit -m "research: refresh Graphify context graph"
          git push
