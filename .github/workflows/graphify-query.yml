name: Graphify Context Query

on:
  push:
    branches:
      - research/graphify-context-substrate
    paths:
      - "research/graphify-context/QUERY_REQUEST.json"

permissions:
  contents: write

env:
  STABLE_BUILD_BRANCH: alice-eipm-v1-build
  GRAPHIFY_VERSION: "0.9.63"

jobs:
  query:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout context branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch all context branches and detect catalog drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/*:refs/remotes/origin/*"
          python scripts/context/check_context_catalog_freshness.py \
            --github-env "$GITHUB_ENV"

      - name: Refresh branch, document, and lexical catalogs when stale
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REFRESH_CONTEXT_CATALOG" != "true" ]; then
            echo "Context catalog is fresh."
            exit 0
          fi
          python scripts/context/build_context_catalog.py
          python scripts/context/build_context_lexical_index.py
          python -m json.tool research/graphify-context/catalog/CATALOG_STATUS.json >/dev/null
          python -m json.tool research/graphify-context/catalog/ACTIVE_MISSION_STATE.json >/dev/null
          python -m json.tool research/graphify-context/catalog/lexical/LEXICAL_STATUS.json >/dev/null
          python scripts/context/check_context_catalog_freshness.py --fail-on-drift

      - name: Query branch and document catalogs
        shell: bash
        run: |
          set -euo pipefail
          QUESTION="$(python - <<'PY'
          import json
          from pathlib import Path
          req=json.loads(
              Path("research/graphify-context/QUERY_REQUEST.json").read_text(
                  encoding="utf-8"
              )
          )
          print(str(req.get("question","")).strip())
          PY
          )"
          python scripts/context/query_context_catalog.py "$QUESTION" --top 20

      - name: Decide whether code graph is required
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          request=json.loads(
              Path("research/graphify-context/QUERY_REQUEST.json").read_text(
                  encoding="utf-8"
              )
          )
          catalog=json.loads(
              Path("research/graphify-context/CATALOG_QUERY_RESULT.json").read_text(
                  encoding="utf-8"
              )
          )
          mission=catalog.get("active_mission_state") or {}
          mode=str(request.get("graphify_mode","auto")).strip().lower()
          if mode not in {"auto","always","never"}:
              raise SystemExit("graphify_mode must be auto, always, or never")

          question=str(request.get("question","")).lower()
          code_terms=(
              "in code","code path","implementation path","which implementation",
              "where in code","which function","which class","which module",
              "call graph","code dependency","source file","trainer code",
              "evaluator code","runner code","script implementation","stack trace",
              "test failure","config field","crosscontextfusion","model.py","__init__",
              "src/","scripts/",".py","()",
          )
          stable=(
              (mission.get("stable_build_base") or {}).get("branch")
              or os.environ["STABLE_BUILD_BRANCH"]
          )
          frontier=mission.get("unmerged_experiment_frontier") or {}
          maximal=frontier.get("maximal_heads") or []
          explicit_stable=any(
              term in question
              for term in (
                  "stable build",
                  "build base",
                  "alice-eipm-v1-build",
                  "canonical build branch",
              )
          )

          if mode == "always":
              use=True
              reason="request forced Graphify"
          elif mode == "never":
              use=False
              reason="request disabled Graphify"
          else:
              use=any(term in question for term in code_terms)
              reason=(
                  "question requires code topology"
                  if use else
                  "document/branch/private routing is sufficient"
              )

          selected_branch=None
          selected_commit=None
          rebuild=False
          source_reason=None

          if use:
              requested_branch=str(
                  request.get("graph_source_branch","")
              ).strip()
              if requested_branch:
                  selected_branch=requested_branch
                  source_reason="request explicitly selected graph source branch"
              elif explicit_stable:
                  selected_branch=stable
                  source_reason="question explicitly targets stable build"
              elif len(maximal) == 1:
                  selected_branch=str(maximal[0].get("branch"))
                  source_reason="single maximal unmerged experiment frontier"
              elif len(maximal) > 1:
                  names=", ".join(
                      str(row.get("branch")) for row in maximal
                  )
                  raise SystemExit(
                      "AMBIGUOUS_CODE_FRONTIER: multiple maximal experiment heads: "
                      + names
                      + ". Set graph_source_branch explicitly."
                  )
              else:
                  selected_branch=stable
                  source_reason="no unmerged experiment frontier exists"

              ref=f"refs/remotes/origin/{selected_branch}"
              proc=subprocess.run(
                  ["git","rev-parse",ref],
                  text=True,
                  capture_output=True,
              )
              if proc.returncode != 0:
                  raise SystemExit(
                      "GRAPH_SOURCE_BRANCH_NOT_FOUND: "
                      + selected_branch
                      + "\n"
                      + proc.stderr
                  )
              selected_commit=proc.stdout.strip()

              graph_path=Path("graphify-out/graph.json")
              build_path=Path(
                  "research/graphify-context/LAST_GRAPH_BUILD.json"
              )
              build={}
              if build_path.exists():
                  try:
                      build=json.loads(
                          build_path.read_text(encoding="utf-8")
                      )
                  except json.JSONDecodeError:
                      build={}
              rebuild=(
                  not graph_path.exists()
                  or build.get("source_work_branch") != selected_branch
                  or build.get("source_work_commit") != selected_commit
                  or build.get("graphify_version") not in {None, os.environ["GRAPHIFY_VERSION"]}
              )

          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as handle:
              handle.write(
                  "USE_GRAPHIFY="
                  + ("true" if use else "false")
                  + "\n"
              )
              handle.write(
                  "REBUILD_GRAPHIFY="
                  + ("true" if rebuild else "false")
                  + "\n"
              )
              if selected_branch:
                  handle.write(
                      "SELECTED_GRAPH_BRANCH="
                      + selected_branch
                      + "\n"
                  )
              if selected_commit:
                  handle.write(
                      "SELECTED_GRAPH_COMMIT="
                      + selected_commit
                      + "\n"
                  )

          decision={
              "graphify_mode":mode,
              "graphify_used":use,
              "reason":reason,
              "graph_source_branch":selected_branch,
              "graph_source_commit":selected_commit,
              "graph_source_reason":source_reason,
              "graph_rebuild_required":rebuild,
              "private_external_route_recommended":
                  catalog.get(
                      "private_external_route_recommended",
                      False,
                  ),
          }
          Path(
              "research/graphify-context/ROUTING_DECISION.json"
          ).write_text(
              json.dumps(decision,indent=2,ensure_ascii=False)+"\n",
              encoding="utf-8",
          )
          print(json.dumps(decision,ensure_ascii=False))
          PY

      - name: Cache Graphify pip downloads
        if: env.USE_GRAPHIFY == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: graphify-pip-${{ runner.os }}-py312-${{ hashFiles('research/graphify-context/requirements-graphify.txt') }}
          restore-keys: |
            graphify-pip-${{ runner.os }}-py312-

      - name: Install Graphify when required
        shell: bash
        run: |
          set -euo pipefail
          if [ "$USE_GRAPHIFY" != "true" ]; then
            echo "Graphify skipped for this query."
            exit 0
          fi
          python -m pip install \
            -r research/graphify-context/requirements-graphify.txt

      - name: Rebuild exact-branch code graph when required
        shell: bash
        run: |
          set -euo pipefail
          if [ "$USE_GRAPHIFY" != "true" ]; then
            echo "No code graph required."
            exit 0
          fi
          if [ "$REBUILD_GRAPHIFY" != "true" ]; then
            echo "Reusing graph for $SELECTED_GRAPH_BRANCH @ $SELECTED_GRAPH_COMMIT"
            exit 0
          fi

          SOURCE_DIR="$RUNNER_TEMP/alice-query-graph-source"
          rm -rf "$SOURCE_DIR"
          git worktree add --detach \
            "$SOURCE_DIR" \
            "refs/remotes/origin/$SELECTED_GRAPH_BRANCH"

          (
            cd "$SOURCE_DIR"
            graphify extract . --code-only
          )

          mkdir -p graphify-out research/graphify-context
          cp "$SOURCE_DIR/graphify-out/graph.json" graphify-out/graph.json
          if [ -f "$SOURCE_DIR/graphify-out/GRAPH_REPORT.md" ]; then
            cp "$SOURCE_DIR/graphify-out/GRAPH_REPORT.md" graphify-out/GRAPH_REPORT.md
          else
            rm -f graphify-out/GRAPH_REPORT.md
          fi

          export SELECTED_GRAPH_BRANCH SELECTED_GRAPH_COMMIT GRAPHIFY_VERSION
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt={
              "source_work_branch":os.environ["SELECTED_GRAPH_BRANCH"],
              "source_work_commit":os.environ["SELECTED_GRAPH_COMMIT"],
              "research_branch":os.environ["GITHUB_REF_NAME"],
              "research_commit":os.environ["GITHUB_SHA"],
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "graph_mode":"code-only",
              "extraction_tree":"exact-source-worktree",
              "graphify_version":os.environ["GRAPHIFY_VERSION"],
              "authority":"navigation-only",
          }
          Path(
              "research/graphify-context/LAST_GRAPH_BUILD.json"
          ).write_text(
              json.dumps(receipt,indent=2)+"\n",
              encoding="utf-8",
          )
          PY

      - name: Assemble scoped query result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          req_path=Path(
              "research/graphify-context/QUERY_REQUEST.json"
          )
          graph_path=Path("graphify-out/graph.json")
          build_path=Path(
              "research/graphify-context/LAST_GRAPH_BUILD.json"
          )
          request=json.loads(req_path.read_text(encoding="utf-8"))
          catalog_result=json.loads(
              Path(
                  "research/graphify-context/CATALOG_QUERY_RESULT.json"
              ).read_text(encoding="utf-8")
          )
          routing=json.loads(
              Path(
                  "research/graphify-context/ROUTING_DECISION.json"
              ).read_text(encoding="utf-8")
          )

          question=str(request.get("question","")).strip()
          if not question:
              raise SystemExit(
                  "QUERY_REQUEST.json has no non-empty question"
              )

          budget=max(
              500,
              min(int(request.get("budget",2500)),12000),
          )
          traversal=str(
              request.get("traversal","bfs")
          ).strip().lower()
          if traversal not in {"bfs","dfs"}:
              raise SystemExit(
                  "traversal must be 'bfs' or 'dfs'"
              )

          contexts=request.get("contexts",[])
          if contexts is None:
              contexts=[]
          if not isinstance(contexts,list):
              raise SystemExit(
                  "contexts must be a JSON array"
              )
          contexts=[
              str(x).strip()
              for x in contexts
              if str(x).strip()
          ][:8]

          graphify_used=bool(routing.get("graphify_used"))
          stdout=""
          stderr=""
          if graphify_used:
              cmd=[
                  "graphify","query",question,
                  "--graph",str(graph_path),
                  "--budget",str(budget),
              ]
              if traversal=="dfs":
                  cmd.append("--dfs")
              for context in contexts:
                  cmd.extend(["--context",context])
              proc=subprocess.run(
                  cmd,
                  text=True,
                  capture_output=True,
              )
              if proc.returncode != 0:
                  raise SystemExit(
                      "graphify query failed\nSTDOUT:\n"
                      + proc.stdout
                      + "\nSTDERR:\n"
                      + proc.stderr
                  )
              stdout=proc.stdout
              stderr=proc.stderr

          graph_build={}
          if build_path.exists():
              graph_build=json.loads(
                  build_path.read_text(encoding="utf-8")
              )

          result={
              "request_id":request.get("request_id"),
              "question":question,
              "budget":budget,
              "traversal":traversal,
              "contexts":contexts,
              "generated_at_utc":
                  datetime.now(timezone.utc).isoformat(),
              "authority":"navigation-only",
              "routing_decision":routing,
              "graphify_used":graphify_used,
              "graph_build":graph_build,
              "catalog_result":catalog_result,
              "graphify_result_text":stdout,
              "graphify_stderr":stderr,
          }
          Path(
              "research/graphify-context/QUERY_RESULT.json"
          ).write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
              )+"\n",
              encoding="utf-8",
          )
          PY

      - name: Compile compact Sol context capsule
        run: |
          python scripts/context/compile_context_capsule.py

      - name: Publish query, refreshed catalogs, and graph cache
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "alice-context-query-bot"
          git config user.email "actions@users.noreply.github.com"

          TMP_DIR="$(mktemp -d)"
          export TMP_DIR
          cp \
            research/graphify-context/QUERY_RESULT.json \
            "$TMP_DIR/QUERY_RESULT.json"
          cp \
            research/graphify-context/CONTEXT_CAPSULE.json \
            "$TMP_DIR/CONTEXT_CAPSULE.json"
          cp \
            research/graphify-context/CONTEXT_CAPSULE.md \
            "$TMP_DIR/CONTEXT_CAPSULE.md"

          if [ "$REFRESH_CONTEXT_CATALOG" = "true" ]; then
            cp -R \
              research/graphify-context/catalog \
              "$TMP_DIR/catalog"
          fi

          if [ "$REBUILD_GRAPHIFY" = "true" ]; then
            mkdir -p "$TMP_DIR/graphify-out"
            cp graphify-out/graph.json "$TMP_DIR/graphify-out/graph.json"
            if [ -f graphify-out/GRAPH_REPORT.md ]; then
              cp \
                graphify-out/GRAPH_REPORT.md \
                "$TMP_DIR/graphify-out/GRAPH_REPORT.md"
            fi
            cp \
              research/graphify-context/LAST_GRAPH_BUILD.json \
              "$TMP_DIR/LAST_GRAPH_BUILD.json"
          fi

          git fetch origin "+refs/heads/*:refs/remotes/origin/*"
          git reset --hard "origin/$GITHUB_REF_NAME"

          if [ "$REFRESH_CONTEXT_CATALOG" = "true" ]; then
            rm -rf research/graphify-context/catalog
            mkdir -p research/graphify-context
            cp -R "$TMP_DIR/catalog" research/graphify-context/catalog
          fi

          python scripts/context/check_context_catalog_freshness.py \
            --fail-on-drift

          export LIVE_SOURCE_COMMIT="$(
            git rev-parse "refs/remotes/origin/$STABLE_BUILD_BRANCH"
          )"

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          current_request=json.loads(
              Path(
                  "research/graphify-context/QUERY_REQUEST.json"
              ).read_text(encoding="utf-8")
          )
          result=json.loads(
              (
                  Path(os.environ["TMP_DIR"])
                  / "QUERY_RESULT.json"
              ).read_text(encoding="utf-8")
          )
          if (
              current_request.get("request_id")
              != result.get("request_id")
          ):
              raise SystemExit(
                  "STALE_QUERY_RESULT: request changed while query was running"
              )

          live_source=os.environ["LIVE_SOURCE_COMMIT"]
          catalog_source=(
              result.get("catalog_result",{})
              .get("catalog_status",{})
              .get("source_commit")
          )
          if catalog_source != live_source:
              raise SystemExit(
                  "STALE_QUERY_RESULT: catalog source "
                  + repr(catalog_source)
                  + " != live stable build "
                  + live_source
              )

          if result.get("graphify_used"):
              graph_build=result.get("graph_build",{})
              branch=graph_build.get("source_work_branch")
              recorded=graph_build.get("source_work_commit")
              if not branch or not recorded:
                  raise SystemExit(
                      "STALE_QUERY_RESULT: graph source metadata missing"
                  )
              live=subprocess.run(
                  [
                      "git","rev-parse",
                      f"refs/remotes/origin/{branch}",
                  ],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout.strip()
              if recorded != live:
                  raise SystemExit(
                      "STALE_QUERY_RESULT: graph source "
                      + repr(recorded)
                      + " != live "
                      + branch
                      + " "
                      + live
                  )
          PY

          cp \
            "$TMP_DIR/QUERY_RESULT.json" \
            research/graphify-context/QUERY_RESULT.json
          cp \
            "$TMP_DIR/CONTEXT_CAPSULE.json" \
            research/graphify-context/CONTEXT_CAPSULE.json
          cp \
            "$TMP_DIR/CONTEXT_CAPSULE.md" \
            research/graphify-context/CONTEXT_CAPSULE.md

          if [ "$REBUILD_GRAPHIFY" = "true" ]; then
            mkdir -p graphify-out research/graphify-context
            cp \
              "$TMP_DIR/graphify-out/graph.json" \
              graphify-out/graph.json
            if [ -f "$TMP_DIR/graphify-out/GRAPH_REPORT.md" ]; then
              cp \
                "$TMP_DIR/graphify-out/GRAPH_REPORT.md" \
                graphify-out/GRAPH_REPORT.md
            else
              rm -f graphify-out/GRAPH_REPORT.md
            fi
            cp \
              "$TMP_DIR/LAST_GRAPH_BUILD.json" \
              research/graphify-context/LAST_GRAPH_BUILD.json
          fi

          git add \
            research/graphify-context/QUERY_RESULT.json \
            research/graphify-context/CONTEXT_CAPSULE.json \
            research/graphify-context/CONTEXT_CAPSULE.md

          if [ "$REFRESH_CONTEXT_CATALOG" = "true" ]; then
            git add research/graphify-context/catalog
          fi

          if [ "$REBUILD_GRAPHIFY" = "true" ]; then
            git add \
              graphify-out/graph.json \
              research/graphify-context/LAST_GRAPH_BUILD.json
            if [ -f graphify-out/GRAPH_REPORT.md ]; then
              git add graphify-out/GRAPH_REPORT.md
            fi
          fi

          if git diff --cached --quiet; then
            echo "No query-result changes."
            exit 0
          fi

          git commit -m "research: update scoped context query result"
          git push origin "HEAD:$GITHUB_REF_NAME"
