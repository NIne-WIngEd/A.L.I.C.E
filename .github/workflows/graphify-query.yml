name: Graphify Context Query

on:
  push:
    branches:
      - research/graphify-context-substrate
    paths:
      - "research/graphify-context/QUERY_REQUEST.json"

permissions:
  contents: write

env:
  GRAPHIFY_SOURCE_BRANCH: alice-eipm-v1-build

jobs:
  query:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout context branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse stale graph
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/$GRAPHIFY_SOURCE_BRANCH:refs/remotes/origin/$GRAPHIFY_SOURCE_BRANCH"
          LIVE_SOURCE_COMMIT="$(git rev-parse "origin/$GRAPHIFY_SOURCE_BRANCH")"
          export LIVE_SOURCE_COMMIT
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          build_path = Path("research/graphify-context/LAST_GRAPH_BUILD.json")
          if not build_path.exists():
              raise SystemExit("STALE_GRAPH: no LAST_GRAPH_BUILD.json exists")

          build = json.loads(build_path.read_text(encoding="utf-8"))
          recorded = build.get("source_work_commit")
          live = os.environ["LIVE_SOURCE_COMMIT"]
          if recorded != live:
              raise SystemExit(
                  "STALE_GRAPH: graph represents "
                  + repr(recorded)
                  + " but alice-eipm-v1-build is "
                  + live
                  + ". Sync and rebuild before querying."
              )
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphify
        run: |
          python -m pip install --upgrade pip
          python -m pip install graphifyy

      - name: Query persistent graph
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          req_path = Path("research/graphify-context/QUERY_REQUEST.json")
          graph_path = Path("graphify-out/graph.json")
          build_path = Path("research/graphify-context/LAST_GRAPH_BUILD.json")

          request = json.loads(req_path.read_text(encoding="utf-8"))
          question = str(request.get("question", "")).strip()
          if not question:
              raise SystemExit("QUERY_REQUEST.json has no non-empty question")

          budget = int(request.get("budget", 2500))
          budget = max(500, min(budget, 12000))

          traversal = str(request.get("traversal", "bfs")).strip().lower()
          if traversal not in {"bfs", "dfs"}:
              raise SystemExit("traversal must be 'bfs' or 'dfs'")

          contexts = request.get("contexts", [])
          if contexts is None:
              contexts = []
          if not isinstance(contexts, list):
              raise SystemExit("contexts must be a JSON array")
          contexts = [str(x).strip() for x in contexts if str(x).strip()][:8]

          cmd = [
              "graphify", "query", question,
              "--graph", str(graph_path),
              "--budget", str(budget),
          ]
          if traversal == "dfs":
              cmd.append("--dfs")
          for context in contexts:
              cmd.extend(["--context", context])

          proc = subprocess.run(cmd, text=True, capture_output=True)
          if proc.returncode != 0:
              raise SystemExit(
                  "graphify query failed\nSTDOUT:\n"
                  + proc.stdout
                  + "\nSTDERR:\n"
                  + proc.stderr
              )

          graph_build = json.loads(build_path.read_text(encoding="utf-8"))

          result = {
              "request_id": request.get("request_id"),
              "question": question,
              "budget": budget,
              "traversal": traversal,
              "contexts": contexts,
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "authority": "navigation-only",
              "graph_build": graph_build,
              "graphify_result_text": proc.stdout,
              "graphify_stderr": proc.stderr,
          }

          Path("research/graphify-context/QUERY_RESULT.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish result on latest research head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "alice-context-query-bot"
          git config user.email "actions@users.noreply.github.com"

          TMP_DIR="$(mktemp -d)"
          cp research/graphify-context/QUERY_RESULT.json "$TMP_DIR/QUERY_RESULT.json"

          git fetch origin             "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"             "+refs/heads/$GRAPHIFY_SOURCE_BRANCH:refs/remotes/origin/$GRAPHIFY_SOURCE_BRANCH"

          LIVE_SOURCE_COMMIT="$(git rev-parse "origin/$GRAPHIFY_SOURCE_BRANCH")"
          export LIVE_SOURCE_COMMIT TMP_DIR

          git reset --hard "origin/$GITHUB_REF_NAME"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          current_request = json.loads(
              Path("research/graphify-context/QUERY_REQUEST.json").read_text(encoding="utf-8")
          )
          result = json.loads(
              (Path(os.environ["TMP_DIR"]) / "QUERY_RESULT.json").read_text(encoding="utf-8")
          )

          if current_request.get("request_id") != result.get("request_id"):
              raise SystemExit(
                  "STALE_QUERY_RESULT: request changed while query was running; refusing to publish old result"
              )

          recorded_source = result.get("graph_build", {}).get("source_work_commit")
          live_source = os.environ["LIVE_SOURCE_COMMIT"]
          if recorded_source != live_source:
              raise SystemExit(
                  f"STALE_QUERY_RESULT: graph source {recorded_source!r} != live source {live_source}"
              )
          PY

          cp "$TMP_DIR/QUERY_RESULT.json" research/graphify-context/QUERY_RESULT.json
          git add research/graphify-context/QUERY_RESULT.json

          if git diff --cached --quiet; then
            echo "No query-result changes."
            exit 0
          fi

          git commit -m "research: update Graphify scoped query result"
          git push origin "HEAD:$GITHUB_REF_NAME"
