name: n0-full-envelope-foundation-build-v1-contract

on:
  push:
    branches:
      - alice-eipm-v1-n0-full-envelope-foundation-build-v1
    paths:
      - "src/alice_personality/n0/semantic_operator_foundation.py"
      - "src/alice_personality/n0/semantic_operator_evidence_targets_v1.py"
      - "src/alice_personality/n0/numeric_contracts.py"
      - "src/alice_personality/n0/semantic_backbone_interface_v1.py"
      - "src/alice_personality/n0/dynamic_structured_state_v2.py"
      - "src/alice_personality/n0/chunked_set_attention_v1.py"
      - "src/alice_personality/n0/dynamic_schema_evidence_graph_v1.py"
      - "src/alice_personality/n0/dynamic_evidence_view_v2.py"
      - "src/alice_personality/n0/dynamic_cross_context_fusion_v3.py"
      - "src/alice_personality/n0/dynamic_competitive_latent_pool_v3.py"
      - "src/alice_personality/n0/semantic_operator_objectives_v1.py"
      - "src/alice_personality/n0/full_envelope_behavioral_objectives_v1.py"
      - "src/alice_personality/n0/full_envelope_loss_balancer_v1.py"
      - "src/alice_personality/n0/public_judgment_probe_v1.py"
      - "src/alice_personality/n0/semantic_context_virtualizer_v1.py"
      - "src/alice_personality/n0/semantic_segment_context_bridge_v1.py"
      - "src/alice_personality/n0/full_envelope_semantic_input_v1.py"
      - "src/alice_personality/n0/chunked_late_interaction.py"
      - "src/alice_personality/n0/full_envelope_structural_types.py"
      - "src/alice_personality/n0/semantic_operator_qsre_adapter.py"
      - "src/alice_personality/n0/qsre_full_envelope_binder_v1.py"
      - "src/alice_personality/n0/qsre_full_envelope_executor_v1.py"
      - "src/alice_personality/n0/n0_full_envelope_stack_v1.py"
      - "tests/eipm/test_n0_semantic_operator_foundation_v1.py"
      - "tests/eipm/test_n0_full_envelope_backbone_interface_v1.py"
      - "tests/eipm/test_n0_chunked_set_attention_v1.py"
      - "tests/eipm/test_n0_full_envelope_successor_mechanics_v1.py"
      - "tests/eipm/test_n0_full_envelope_fabric_v1.py"
      - "tests/eipm/test_n0_full_envelope_stack_v1.py"
      - "tests/eipm/test_n0_full_envelope_context_and_objectives_v1.py"
      - "scripts/eipm/n0/build_n0_v02_semantic_operator_intervention_curriculum_v1.py"
      - "scripts/eipm/n0/audit_n0_v02_semantic_operator_curriculum_v1.py"
      - "scripts/eipm/n0/audit_n0_v02_operator_evidence_token_alignment_v1.py"
      - "scripts/eipm/n0/build_n0_v02_fewrel_natural_relation_curriculum_v1.py"
      - "scripts/eipm/n0/audit_n0_v02_fewrel_natural_relation_curriculum_v1.py"
      - "configs/eipm/n0/n0_v02_natural_relation_sources_v1.json"
      - "configs/eipm/n0/n0_v02_semantic_operator_curriculum_contract_v1.json"
      - "configs/eipm/n0/n0_v02_full_envelope_retrospective_audit_v1.json"
      - "configs/eipm/n0/n0_v02_full_envelope_interface_contract_v1.json"
      - "configs/eipm/n0/n0_v02_full_envelope_final_validation_contract_v2.json"
      - "configs/eipm/n0/n0_v02_semantic_operator_joint_training_plan_v1.json"
      - "configs/eipm/n0/n0_v02_full_envelope_supersession_map_v1.json"
      - "configs/eipm/n0/n0_v02_capacity_escalation_contract_v1.json"
      - "configs/eipm/n0/n0_v02_full_envelope_proof_obligations_v1.json"
      - "configs/eipm/n0/n0_v02_successor_authority_firewall_v1.json"
      - "scripts/eipm/n0/audit_n0_v02_full_envelope_proof_obligations_v1.py"
      - "docs/research/eipm-n0-full-envelope-retrospective-audit-v1.md"
      - "docs/research/eipm-n0-full-envelope-interface-contract-v1.md"
      - "configs/eipm/n0/n0_v02_full_envelope_cpu_runtime_qualification_v1.json"
      - "scripts/eipm/n0/qualify_n0_v02_full_envelope_cpu_runtime_v1.py"
      - "scripts/eipm/n0/audit_n0_v02_full_envelope_cpu_runtime_contract_v1.py"
      - "scripts/eipm/n0/run_n0_v02_full_envelope_cpu_runtime_v1.sh"
      - "scripts/eipm/n0/magnolia_cpu_n0_v02_full_envelope_runtime_v1.sbatch"
      - "src/alice_personality/n0/n0_full_envelope_trainable_system_v1.py"
      - "src/alice_personality/n0/full_envelope_training_objective_v1.py"
      - "tests/eipm/test_n0_full_envelope_trainable_system_v1.py"
      - ".github/workflows/n0-full-envelope-foundation-build-v1-contract.yml"
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:scripts/eipm/n0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install static mechanics dependencies
        run: python -m pip install -q torch pytest numpy

      - name: Compile complete successor source and governance
        run: |
          set -euo pipefail
          python -m py_compile \
            src/alice_personality/n0/semantic_operator_foundation.py \
            src/alice_personality/n0/semantic_operator_evidence_targets_v1.py \
            src/alice_personality/n0/numeric_contracts.py \
            src/alice_personality/n0/semantic_backbone_interface_v1.py \
            src/alice_personality/n0/dynamic_structured_state_v2.py \
            src/alice_personality/n0/chunked_set_attention_v1.py \
            src/alice_personality/n0/dynamic_schema_evidence_graph_v1.py \
            src/alice_personality/n0/dynamic_evidence_view_v2.py \
            src/alice_personality/n0/dynamic_cross_context_fusion_v3.py \
            src/alice_personality/n0/dynamic_competitive_latent_pool_v3.py \
            src/alice_personality/n0/semantic_operator_objectives_v1.py \
            src/alice_personality/n0/full_envelope_behavioral_objectives_v1.py \
            src/alice_personality/n0/full_envelope_loss_balancer_v1.py \
            src/alice_personality/n0/public_judgment_probe_v1.py \
            src/alice_personality/n0/semantic_context_virtualizer_v1.py \
            src/alice_personality/n0/semantic_segment_context_bridge_v1.py \
            src/alice_personality/n0/full_envelope_semantic_input_v1.py \
            src/alice_personality/n0/n0_full_envelope_trainable_system_v1.py \
            src/alice_personality/n0/full_envelope_training_objective_v1.py \
            src/alice_personality/n0/chunked_late_interaction.py \
            src/alice_personality/n0/full_envelope_structural_types.py \
            src/alice_personality/n0/semantic_operator_qsre_adapter.py \
            src/alice_personality/n0/qsre_full_envelope_binder_v1.py \
            src/alice_personality/n0/qsre_full_envelope_executor_v1.py \
            src/alice_personality/n0/n0_full_envelope_stack_v1.py \
            scripts/eipm/n0/build_n0_v02_semantic_operator_intervention_curriculum_v1.py \
            scripts/eipm/n0/audit_n0_v02_semantic_operator_curriculum_v1.py \
            scripts/eipm/n0/audit_n0_v02_operator_evidence_token_alignment_v1.py \
            scripts/eipm/n0/build_n0_v02_fewrel_natural_relation_curriculum_v1.py \
            scripts/eipm/n0/audit_n0_v02_fewrel_natural_relation_curriculum_v1.py \
            scripts/eipm/n0/audit_n0_v02_full_envelope_proof_obligations_v1.py \
            scripts/eipm/n0/audit_n0_v02_full_envelope_cpu_runtime_contract_v1.py \
            scripts/eipm/n0/qualify_n0_v02_full_envelope_cpu_runtime_v1.py

          for f in \
            configs/eipm/n0/n0_v02_natural_relation_sources_v1.json \
            configs/eipm/n0/n0_v02_semantic_operator_curriculum_contract_v1.json \
            configs/eipm/n0/n0_v02_full_envelope_retrospective_audit_v1.json \
            configs/eipm/n0/n0_v02_full_envelope_interface_contract_v1.json \
            configs/eipm/n0/n0_v02_full_envelope_final_validation_contract_v2.json \
            configs/eipm/n0/n0_v02_semantic_operator_joint_training_plan_v1.json \
            configs/eipm/n0/n0_v02_full_envelope_supersession_map_v1.json \
            configs/eipm/n0/n0_v02_capacity_escalation_contract_v1.json \
            configs/eipm/n0/n0_v02_full_envelope_proof_obligations_v1.json \
            configs/eipm/n0/n0_v02_successor_authority_firewall_v1.json
          do
            python -m json.tool "$f" >/dev/null
          done

      - name: Run complete successor mechanics suite
        run: |
          set -euo pipefail
          pytest -q \
            tests/eipm/test_n0_semantic_operator_foundation_v1.py \
            tests/eipm/test_n0_full_envelope_backbone_interface_v1.py \
            tests/eipm/test_n0_chunked_set_attention_v1.py \
            tests/eipm/test_n0_full_envelope_successor_mechanics_v1.py \
            tests/eipm/test_n0_full_envelope_fabric_v1.py \
            tests/eipm/test_n0_full_envelope_stack_v1.py \
            tests/eipm/test_n0_full_envelope_context_and_objectives_v1.py

      - name: Materialize and audit synthetic intervention supplement
        run: |
          set -euo pipefail
          rm -rf /tmp/n0-so
          mkdir -p /tmp/n0-so
          python scripts/eipm/n0/build_n0_v02_semantic_operator_intervention_curriculum_v1.py \
            --output /tmp/n0-so/rows.jsonl \
            --manifest /tmp/n0-so/manifest.json \
            --examples-per-relation 20 \
            --candidate-counts 1,2,4,8,16
          python scripts/eipm/n0/audit_n0_v02_semantic_operator_curriculum_v1.py \
            --rows /tmp/n0-so/rows.jsonl \
            --manifest /tmp/n0-so/manifest.json \
            --contract configs/eipm/n0/n0_v02_semantic_operator_curriculum_contract_v1.json \
            --output /tmp/n0-so/audit.json
          python - <<'PY'
          import json
          r=json.load(open("/tmp/n0-so/audit.json"))
          assert r["status"]=="PASS_SEMANTIC_OPERATOR_CURRICULUM_AUDIT"
          assert r["relation_family_overlap"]==[]
          assert r["template_overlap"]==[]
          assert r["entity_overlap"]==[]
          assert r["private_identity_data"] is False
          assert r["training_authorized_by_audit"] is False
          assert r["natural_public_replay_still_required"] is True
          assert r["query_relation_evidence_spans_required"] is True
          assert r["relation_schema_evidence_spans_required"] is True
          assert r["factor_schema_evidence_spans_required"] is True
          assert r["step_factor_schema_evidence_spans_required"] is True
          print("PASS_N0_SYNTHETIC_INTERVENTION_STATIC_AUDIT")
          PY

      - name: Materialize and audit exact FewRel natural relation lane
        run: |
          set -euo pipefail
          rm -rf /tmp/fewrel /tmp/n0-fewrel
          git init -q /tmp/fewrel
          git -C /tmp/fewrel remote add origin https://github.com/thunlp/FewRel.git
          git -C /tmp/fewrel fetch -q --depth 1 origin 278a2315d2138810a379cd8d5718914dc56e2582
          git -C /tmp/fewrel checkout -q FETCH_HEAD
          test "$(git -C /tmp/fewrel rev-parse HEAD)" = "278a2315d2138810a379cd8d5718914dc56e2582"

          mkdir -p /tmp/n0-fewrel
          python scripts/eipm/n0/build_n0_v02_fewrel_natural_relation_curriculum_v1.py \
            --fewrel-root /tmp/fewrel \
            --train-dev-rows-output /tmp/n0-fewrel/train_dev_rows.jsonl \
            --train-dev-bank-output /tmp/n0-fewrel/train_dev_bank.json \
            --final-rows-output /tmp/n0-fewrel/final_rows.jsonl \
            --final-bank-output /tmp/n0-fewrel/final_bank.json \
            --manifest-output /tmp/n0-fewrel/manifest.json
          python scripts/eipm/n0/audit_n0_v02_fewrel_natural_relation_curriculum_v1.py \
            --train-dev-rows /tmp/n0-fewrel/train_dev_rows.jsonl \
            --train-dev-bank /tmp/n0-fewrel/train_dev_bank.json \
            --final-rows /tmp/n0-fewrel/final_rows.jsonl \
            --final-bank /tmp/n0-fewrel/final_bank.json \
            --manifest /tmp/n0-fewrel/manifest.json \
            --output /tmp/n0-fewrel/audit.json
          python - <<'PY'
          import json
          r=json.load(open("/tmp/n0-fewrel/audit.json"))
          assert r["status"]=="PASS_FEWREL_NATURAL_RELATION_AUDIT_V3"
          assert r["train_relation_count"]==56
          assert r["dev_relation_count"]==8
          assert r["final_relation_count"]==16
          assert not r["relation_overlap"]["train_dev"]
          assert not r["relation_overlap"]["train_final"]
          assert not r["relation_overlap"]["dev_final"]
          assert r["source_overlap"]["train_dev"]==0
          assert r["source_overlap"]["train_final"]==0
          assert r["source_overlap"]["dev_final"]==0
          assert r["final_relation_descriptions_absent_from_train_dev_bank"] is True
          assert r["final_training_authorized"] is False
          assert r["final_model_selection_authorized"] is False
          assert r["final_training_authorized"] is False
          assert r["final_model_selection_authorized"] is False
          assert r["private_identity_data"] is False
          print("PASS_N0_NATURAL_RELATION_SEALED_FINAL_AUDIT")
          PY

      - name: Prove successor lineage cannot import superseded semantic authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, json, pathlib
          successor = [
              "src/alice_personality/n0/semantic_operator_foundation.py",
              "src/alice_personality/n0/dynamic_structured_state_v2.py",
              "src/alice_personality/n0/dynamic_schema_evidence_graph_v1.py",
              "src/alice_personality/n0/dynamic_evidence_view_v2.py",
              "src/alice_personality/n0/dynamic_cross_context_fusion_v3.py",
              "src/alice_personality/n0/dynamic_competitive_latent_pool_v3.py",
              "src/alice_personality/n0/semantic_operator_qsre_adapter.py",
              "src/alice_personality/n0/qsre_full_envelope_binder_v1.py",
              "src/alice_personality/n0/qsre_full_envelope_executor_v1.py",
              "src/alice_personality/n0/n0_full_envelope_stack_v1.py",
          ]
          contract=json.load(open("configs/eipm/n0/n0_v02_full_envelope_supersession_map_v1.json"))
          forbidden=set(contract["forbidden_new_lineage_dependencies"])
          found=[]
          for path in successor:
              tree=ast.parse(pathlib.Path(path).read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and node.module in forbidden:
                      found.append((path,node.module))
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name in forbidden:
                              found.append((path,alias.name))
          assert not found, found
          print("PASS_N0_SUCCESSOR_NO_SUPERSEDED_IMPORTS")
          PY

      - name: Prove no detached semantic gradient or hidden identity tables in successor
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          critical = [
              "src/alice_personality/n0/semantic_operator_foundation.py",
              "src/alice_personality/n0/dynamic_structured_state_v2.py",
              "src/alice_personality/n0/dynamic_schema_evidence_graph_v1.py",
              "src/alice_personality/n0/dynamic_evidence_view_v2.py",
              "src/alice_personality/n0/dynamic_cross_context_fusion_v3.py",
              "src/alice_personality/n0/dynamic_competitive_latent_pool_v3.py",
              "src/alice_personality/n0/qsre_full_envelope_binder_v1.py",
              "src/alice_personality/n0/qsre_full_envelope_executor_v1.py",
              "src/alice_personality/n0/public_judgment_probe_v1.py",
              "src/alice_personality/n0/n0_full_envelope_stack_v1.py",
          ]
          for path in critical:
              text=pathlib.Path(path).read_text()
              assert ".detach(" not in text, path
              assert "nn.Embedding(" not in text, path
          print("PASS_N0_SUCCESSOR_NO_DETACHED_SEMANTIC_PATH_OR_ID_EMBEDDING")
          PY

      - name: Prove runtime axes are not learned identity axes
        run: |
          python - <<'PY'
          from alice_personality.n0.semantic_operator_foundation import (
              SchemaConditionedSemanticOperator,
              SemanticOperatorFoundationConfig,
          )
          m=SchemaConditionedSemanticOperator(
              SemanticOperatorFoundationConfig(
                  semantic_dim=24,
                  model_dim=24,
                  num_hidden_states=3,
                  interaction_chunk_tokens=5,
                  dropout=0.0,
              )
          )
          r=m.parameter_report()
          assert r["relation_identity_parameters"]==0
          assert r["factor_identity_parameters"]==0
          assert r["candidate_count_dependent_parameters"]==0
          assert r["runtime_step_count_dependent_parameters"]==0
          assert r["type_vocabulary_dependent_parameters"]==0
          assert r["relation_count_ceiling"] is None
          assert r["factor_count_ceiling"] is None
          assert r["runtime_step_count_ceiling"] is None
          assert r["type_vocabulary_ceiling"] is None
          assert r["query_token_count_ceiling"] is None
          assert r["schema_token_count_ceiling"] is None
          assert r["shared_query_schema_token_interaction"] is True
          assert r["candidate_conditioned_multilayer_read"] is True
          assert r["continuous_relation_hypotheses"] is True
          assert r["exact_structural_sparsity"] is False
          assert r["semantic_backbone_gradient_can_flow"] is True
          print("PASS_N0_RUNTIME_SCHEMA_NO_IDENTITY_AXIS")
          PY

      - name: Prove retrospective audit and supersession map revoke narrow-pass authority
        run: |
          python - <<'PY'
          import json
          a=json.load(open("configs/eipm/n0/n0_v02_full_envelope_retrospective_audit_v1.json"))
          s=json.load(open("configs/eipm/n0/n0_v02_full_envelope_supersession_map_v1.json"))
          assert "MUST_REOPEN_BEFORE_N0_CLOSURE" in a["stages"]["semantic_base"]["classification"]
          assert "PRESERVE_STRONG_ARCHITECTURE" in a["stages"]["fusion"]["classification"]
          assert "PRESERVE_STRONG_ARCHITECTURE" in a["stages"]["latent_pool"]["classification"]
          assert "PRESERVE_STRONG_ARCHITECTURE" in a["stages"]["causal_arbitration"]["classification"]
          assert "EXPERIMENTAL_OPERATING_POINT_ONLY" in a["stages"]["qsre_t1"]["classification"]
          assert "SUPERSEDED_DEFECT" in a["stages"]["qsre_t2"]["classification"]
          assert a["cross_cutting_findings"]["self_referential_validation_chain"] is True
          assert a["cross_cutting_findings"]["temporary_freezes_became_architecture_assumptions"] is True
          m=s["historical_to_successor"]
          assert m["semantic_v02"]["frozen_authority"] is False
          assert m["semantic_v02"]["must_coadapt"] is True
          assert m["final_validation_v1"]["future_closure_authority"] is False
          for key in [
              "structured_state_v01",
              "evidence_view_adapter_v01",
              "dual_endpoint_evidence_graph",
              "cross_context_fusion_v02",
              "adaptive_latent_pool_v02",
              "qsre_t1",
              "qsre_t2",
              "production_core_v1",
              "binder_v2",
          ]:
              assert m[key]["weight_reuse"].startswith("FORBIDDEN"), (key,m[key]["weight_reuse"])
          print("PASS_N0_NARROW_PASS_AUTHORITY_REVOKED")
          PY

      - name: Prove dynamic evidence fusion latent have no runtime identity axes
        run: |
          python - <<'PY'
          from alice_personality.n0.dynamic_evidence_view_v2 import DynamicEvidenceViewV2
          from alice_personality.n0.dynamic_cross_context_fusion_v3 import DynamicCrossContextFusionV3
          from alice_personality.n0.dynamic_competitive_latent_pool_v3 import DynamicCompetitiveLatentPoolV3
          e=DynamicEvidenceViewV2().parameter_report()
          f=DynamicCrossContextFusionV3().parameter_report()
          l=DynamicCompetitiveLatentPoolV3().parameter_report()
          assert e["relation_identity_parameters"]==0
          assert e["relation_count_dependent_parameters"]==0
          assert e["pooled_only_query_conditioning"] is False
          assert e["query_token_count_ceiling"] is None
          assert e["field_token_count_ceiling"] is None
          assert f["view_identity_parameters"]==0
          assert f["view_count_dependent_parameters"]==0
          assert f["view_count_ceiling"] is None
          assert l["slot_identity_parameters"]==0
          assert l["view_identity_parameters"]==0
          assert l["slot_count_dependent_parameters"]==0
          assert l["view_count_dependent_parameters"]==0
          assert l["slot_count_ceiling"] is None
          assert l["view_count_ceiling"] is None
          print("PASS_N0_DYNAMIC_FABRIC_NO_RUNTIME_IDENTITY_AXIS")
          PY

      - name: Prove tiny full-stack wiring has no serving-axis ceilings
        run: |
          python - <<'PY'
          from alice_personality.n0.n0_full_envelope_stack_v1 import (
              N0FullEnvelopeStackConfig,
              N0FullEnvelopeStackV1,
          )
          m=N0FullEnvelopeStackV1(
              N0FullEnvelopeStackConfig(
                  semantic_dim=24,
                  model_dim=24,
                  num_hidden_states=3,
                  num_attention_heads=4,
                  structured_layers=1,
                  field_metadata_dim=3,
                  edge_metadata_dim=4,
                  dropout=0.0,
              )
          )
          r=m.parameter_report()
          assert r["runtime_relation_ceiling"] is None
          assert r["runtime_factor_ceiling"] is None
          assert r["runtime_field_ceiling"] is None
          assert r["runtime_edge_ceiling"] is None
          assert r["runtime_view_ceiling"] is None
          assert r["runtime_slot_ceiling"] is None
          assert r["runtime_reasoning_step_ceiling"] is None
          assert r["semantic_backbone_gradient_must_remain_connected"] is True
          assert r["exact_structural_sparsity_boundary"]=="FullEnvelopeQSREBinderV1"
          print("PASS_N0_FULL_SUCCESSOR_STACK_NO_SERVING_AXIS_CEILINGS")
          PY

      - name: Prove context virtualization removes native-window product ceiling
        run: |
          python - <<'PY'
          from alice_personality.n0.semantic_context_virtualizer_v1 import SemanticContextVirtualizerV1
          r=SemanticContextVirtualizerV1().parameter_report()
          assert r["total_parameters"]==0
          assert r["native_window_is_operating_point"] is True
          assert r["segment_count_dependent_parameters"]==0
          assert r["segment_count_ceiling"] is None
