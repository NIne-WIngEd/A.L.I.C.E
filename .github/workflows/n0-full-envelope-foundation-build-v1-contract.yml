            src/alice_personality/n0/full_envelope_stage_policy_v1.py \
            src/alice_personality/n0/full_envelope_training_batch_scheduler_v1.py \
            src/alice_personality/n0/full_envelope_runtime_factory_v1.py \
            src/alice_personality/n0/chunked_late_interaction.py \
            src/alice_personality/n0/full_envelope_structural_types.py \
            src/alice_personality/n0/semantic_operator_qsre_adapter.py \
            src/alice_personality/n0/qsre_full_envelope_binder_v1.py \
            src/alice_personality/n0/qsre_full_envelope_executor_v1.py \
            src/alice_personality/n0/n0_full_envelope_stack_v1.py \
            scripts/eipm/n0/build_n0_v02_semantic_operator_intervention_curriculum_v1.py \
            scripts/eipm/n0/audit_n0_v02_semantic_operator_curriculum_v1.py \
            scripts/eipm/n0/audit_n0_v02_full_envelope_shortcuts_v1.py \
            scripts/eipm/n0/audit_n0_v02_operator_evidence_token_alignment_v1.py \
            scripts/eipm/n0/build_n0_v02_full_envelope_behavioral_curriculum_v1.py \
            scripts/eipm/n0/audit_n0_v02_full_envelope_behavioral_curriculum_v1.py \
            scripts/eipm/n0/evaluate_n0_v02_full_envelope_dev_v1.py \
            scripts/eipm/n0/train_n0_v02_full_envelope_joint_v1.py \
            scripts/eipm/n0/authorize_n0_v02_full_envelope_training_v1.py \
            scripts/eipm/n0/select_n0_v02_full_envelope_dev_checkpoint_v1.py \
            scripts/eipm/n0/audit_n0_v02_semantic_operator_long_context_curriculum_v1.py \
            scripts/eipm/n0/build_n0_v02_semantic_operator_long_context_curriculum_v1.py \
            scripts/eipm/n0/qualify_n0_v02_full_envelope_gpu_memory_v1.py \
            scripts/eipm/n0/audit_n0_v02_full_public_mixture_manifest_v1.py \
            scripts/eipm/n0/build_n0_v02_full_public_mixture_manifest_v1.py \
            scripts/eipm/n0/build_n0_v02_full_envelope_runtime_view_curriculum_v1.py \
            scripts/eipm/n0/audit_n0_v02_full_envelope_runtime_view_curriculum_v1.py \
            scripts/eipm/n0/build_n0_v02_full_envelope_long_context_curriculum_v1.py \
            scripts/eipm/n0/audit_n0_v02_full_envelope_long_context_curriculum_v1.py \
            scripts/eipm/n0/audit_n0_v02_full_envelope_long_context_token_boundaries_v1.py \
            scripts/eipm/n0/audit_n0_v02_semantic_operator_long_token_alignment_v1.py \
            scripts/eipm/n0/build_n0_v02_fewrel_natural_relation_curriculum_v1.py \
            scripts/eipm/n0/audit_n0_v02_fewrel_natural_relation_curriculum_v1.py \
            scripts/eipm/n0/build_n0_v02_full_envelope_final_v2_package.py \
            scripts/eipm/n0/audit_n0_v02_full_envelope_final_v2_package.py \
            scripts/eipm/n0/freeze_n0_v02_full_envelope_final_v2_package.py \
            scripts/eipm/n0/authorize_n0_v02_full_envelope_final_v2_opening.py \
            scripts/eipm/n0/evaluate_n0_v02_full_envelope_final_v2.py \
            scripts/eipm/n0/audit_n0_v02_full_envelope_proof_obligations_v1.py \
            scripts/eipm/n0/audit_n0_v02_full_envelope_cpu_runtime_contract_v1.py \
            scripts/eipm/n0/qualify_n0_v02_full_envelope_cpu_runtime_v1.py

          for f in \
            configs/eipm/n0/n0_v02_natural_relation_sources_v1.json \
            configs/eipm/n0/n0_v02_semantic_operator_curriculum_contract_v1.json \
            configs/eipm/n0/n0_v02_semantic_operator_long_context_contract_v1.json \
            configs/eipm/n0/n0_v02_full_envelope_behavioral_curriculum_contract_v1.json \
            configs/eipm/n0/n0_v02_full_envelope_runtime_view_curriculum_contract_v1.json \
