            configs/eipm/n0/n0_v02_full_envelope_long_context_curriculum_contract_v1.json \
            configs/eipm/n0/n0_v02_full_public_mixture_contract_v1.json \
            configs/eipm/n0/n0_v02_full_envelope_registered_topology_v1.json \
            configs/eipm/n0/n0_v02_full_envelope_checkpoint_contract_v1.json \
            configs/eipm/n0/n0_v02_full_envelope_dev_validation_contract_v1.json \
            configs/eipm/n0/n0_v02_full_envelope_dev_gate_registry_v1.json \
            configs/eipm/n0/n0_v02_semantic_operator_joint_training_plan_v1.json \
            configs/eipm/n0/n0_v02_full_envelope_supersession_map_v1.json \
            configs/eipm/n0/n0_v02_capacity_escalation_contract_v1.json \
            configs/eipm/n0/n0_v02_full_envelope_proof_obligations_v1.json \
            configs/eipm/n0/n0_v02_successor_authority_firewall_v1.json
          do
            python -m json.tool "$f" >/dev/null
          done

      - name: Run every proof-matrix static mechanics test
        run: |
          set -euo pipefail
          mapfile -t TESTS < <(
            python - <<'PY'
          import json
          p=json.load(open("configs/eipm/n0/n0_v02_full_envelope_proof_obligations_v1.json"))
          for path in p["static_test_files"]:
              print(path)
          PY
          )
          test "${#TESTS[@]}" -ge 1
          printf 'proof-matrix-test=%s\n' "${TESTS[@]}"
          pytest -q "${TESTS[@]}"

      - name: Materialize and audit synthetic intervention supplement
        run: |
          set -euo pipefail
          rm -rf /tmp/n0-so
          mkdir -p /tmp/n0-so
          python scripts/eipm/n0/build_n0_v02_semantic_operator_intervention_curriculum_v1.py \
            --output /tmp/n0-so/rows.jsonl \
            --manifest /tmp/n0-so/manifest.json \
            --examples-per-relation 20 \
            --candidate-counts 1,2,4,8,16
          python scripts/eipm/n0/audit_n0_v02_semantic_operator_curriculum_v1.py \
            --rows /tmp/n0-so/rows.jsonl \
            --manifest /tmp/n0-so/manifest.json \
            --contract configs/eipm/n0/n0_v02_semantic_operator_curriculum_contract_v1.json \
            --output /tmp/n0-so/audit.json
          python - <<'PY'
          import json
          r=json.load(open("/tmp/n0-so/audit.json"))
          assert r["status"]=="PASS_SEMANTIC_OPERATOR_CURRICULUM_AUDIT"
          assert r["relation_family_overlap"]==[]
          assert r["template_overlap"]==[]
          assert r["entity_overlap"]==[]
          assert r["private_identity_data"] is False
          assert r["training_authorized_by_audit"] is False
          assert r["natural_public_replay_still_required"] is True
          assert r["query_relation_evidence_spans_required"] is True
          assert r["relation_schema_evidence_spans_required"] is True
          assert r["factor_schema_evidence_spans_required"] is True
          assert r["step_factor_schema_evidence_spans_required"] is True
          print("PASS_N0_SYNTHETIC_INTERVENTION_STATIC_AUDIT")
          PY

      - name: Materialize and audit full-envelope behavioral fabric
        run: |
          set -euo pipefail
          rm -rf /tmp/n0-behavioral
          mkdir -p /tmp/n0-behavioral
          python scripts/eipm/n0/build_n0_v02_full_envelope_behavioral_curriculum_v1.py \
            --output /tmp/n0-behavioral/rows.jsonl \
            --manifest /tmp/n0-behavioral/manifest.json \
            --train-rows 280 \
            --dev-rows 112
          python scripts/eipm/n0/audit_n0_v02_full_envelope_behavioral_curriculum_v1.py \
            --rows /tmp/n0-behavioral/rows.jsonl \
            --manifest /tmp/n0-behavioral/manifest.json \
            --contract configs/eipm/n0/n0_v02_full_envelope_behavioral_curriculum_contract_v1.json \
            --output /tmp/n0-behavioral/audit.json
          python - <<'PY'
          import json
          r=json.load(open("/tmp/n0-behavioral/audit.json"))
          assert r["status"]=="PASS_N0_FULL_ENVELOPE_BEHAVIORAL_CURRICULUM_AUDIT_V1"
          assert r["train_dev_entity_overlap"]==[]
          assert r["train_dev_template_overlap"]==[]
          assert set(r["reasoning_step_points"]) >= {0,1,2}
          assert len(r["relation_count_points"]) >= 4
          assert len(r["field_count_points"]) >= 4
          assert len(r["edge_count_points"]) >= 4
          assert r["private_identity_data"] is False
          assert r["gradient"] is False
          assert r["optimizer"] is False
          assert r["gpu_training_authorized"] is False
          assert r["n0_complete"] is False
          print("PASS_N0_FULL_ENVELOPE_BEHAVIORAL_FABRIC_STATIC_AUDIT")
          PY

      - name: Materialize and audit additional runtime-view TRAIN DEV supplement
        run: |
          set -euo pipefail
          rm -rf /tmp/n0-runtime-views
          mkdir -p /tmp/n0-runtime-views
          python scripts/eipm/n0/build_n0_v02_full_envelope_runtime_view_curriculum_v1.py \
            --output /tmp/n0-runtime-views/rows.jsonl \
            --manifest /tmp/n0-runtime-views/manifest.json
