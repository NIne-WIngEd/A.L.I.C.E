name: n0-full-envelope-foundation-build-v1-contract

on:
  push:
    branches:
      - alice-eipm-v1-n0-full-envelope-foundation-build-v1
    paths:
      - "src/alice_personality/n0/semantic_operator_foundation.py"
      - "src/alice_personality/n0/dynamic_structured_state_v2.py"
      - "src/alice_personality/n0/dynamic_schema_evidence_graph_v1.py"
      - "src/alice_personality/n0/dynamic_evidence_view_v2.py"
      - "src/alice_personality/n0/dynamic_cross_context_fusion_v3.py"
      - "src/alice_personality/n0/dynamic_competitive_latent_pool_v3.py"
      - "src/alice_personality/n0/semantic_operator_objectives_v1.py"
      - "src/alice_personality/n0/semantic_operator_qsre_adapter.py"
      - "src/alice_personality/n0/qsre_full_envelope_binder_v1.py"
      - "src/alice_personality/n0/qsre_full_envelope_executor_v1.py"
      - "src/alice_personality/n0/n0_full_envelope_stack_v1.py"
      - "tests/eipm/test_n0_semantic_operator_foundation_v1.py"
      - "tests/eipm/test_n0_full_envelope_successor_mechanics_v1.py"
      - "tests/eipm/test_n0_full_envelope_fabric_v1.py"
      - "tests/eipm/test_n0_full_envelope_stack_v1.py"
      - "scripts/eipm/n0/build_n0_v02_semantic_operator_intervention_curriculum_v1.py"
      - "scripts/eipm/n0/audit_n0_v02_semantic_operator_curriculum_v1.py"
      - "configs/eipm/n0/n0_v02_semantic_operator_curriculum_contract_v1.json"
      - "configs/eipm/n0/n0_v02_full_envelope_retrospective_audit_v1.json"
      - "docs/research/eipm-n0-full-envelope-retrospective-audit-v1.md"
      - "configs/eipm/n0/n0_v02_full_envelope_interface_contract_v1.json"
      - "docs/research/eipm-n0-full-envelope-interface-contract-v1.md"
      - "configs/eipm/n0/n0_v02_full_envelope_final_validation_contract_v2.json"
      - "configs/eipm/n0/n0_v02_semantic_operator_joint_training_plan_v1.json"
      - ".github/workflows/n0-full-envelope-foundation-build-v1-contract.yml"
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:scripts/eipm/n0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install static mechanics dependencies
        run: python -m pip install -q torch pytest

      - name: Compile source and curriculum tooling
        run: |
          set -euo pipefail
          python -m py_compile             src/alice_personality/n0/semantic_operator_foundation.py             scripts/eipm/n0/build_n0_v02_semantic_operator_intervention_curriculum_v1.py             scripts/eipm/n0/audit_n0_v02_semantic_operator_curriculum_v1.py
          python -m json.tool configs/eipm/n0/n0_v02_semantic_operator_curriculum_contract_v1.json >/dev/null
          python -m json.tool configs/eipm/n0/n0_v02_full_envelope_retrospective_audit_v1.json >/dev/null
          python -m json.tool configs/eipm/n0/n0_v02_full_envelope_interface_contract_v1.json >/dev/null
          python -m json.tool configs/eipm/n0/n0_v02_full_envelope_final_validation_contract_v2.json >/dev/null
          python -m json.tool configs/eipm/n0/n0_v02_semantic_operator_joint_training_plan_v1.json >/dev/null

      - name: Run semantic operator mechanics
        run: |
          pytest -q \
            tests/eipm/test_n0_semantic_operator_foundation_v1.py \
            tests/eipm/test_n0_full_envelope_successor_mechanics_v1.py \
            tests/eipm/test_n0_full_envelope_fabric_v1.py \
            tests/eipm/test_n0_full_envelope_stack_v1.py

      - name: Materialize and audit intervention supplement
        run: |
          set -euo pipefail
          mkdir -p /tmp/n0-so
          python scripts/eipm/n0/build_n0_v02_semantic_operator_intervention_curriculum_v1.py             --output /tmp/n0-so/rows.jsonl             --manifest /tmp/n0-so/manifest.json             --examples-per-relation 20             --candidate-counts 1,2,4,8,16
          python scripts/eipm/n0/audit_n0_v02_semantic_operator_curriculum_v1.py             --rows /tmp/n0-so/rows.jsonl             --manifest /tmp/n0-so/manifest.json             --contract configs/eipm/n0/n0_v02_semantic_operator_curriculum_contract_v1.json             --output /tmp/n0-so/audit.json
          python - <<'PY'
          import json
          r=json.load(open("/tmp/n0-so/audit.json"))
          assert r["status"]=="PASS_SEMANTIC_OPERATOR_CURRICULUM_AUDIT"
          assert r["relation_family_overlap"]==[]
          assert r["template_overlap"]==[]
          assert r["entity_overlap"]==[]
          assert r["private_identity_data"] is False
          assert r["training_authorized_by_audit"] is False
          assert r["natural_public_replay_still_required"] is True
          print("PASS_N0_FULL_ENVELOPE_CURRICULUM_STATIC_AUDIT")
          PY

      - name: Prove runtime axes are not learned identity axes
        run: |
          python - <<'PY'
          from alice_personality.n0.semantic_operator_foundation import (
              SchemaConditionedSemanticOperator,
              SemanticOperatorFoundationConfig,
          )
          m=SchemaConditionedSemanticOperator(
              SemanticOperatorFoundationConfig(
                  semantic_dim=24,model_dim=24,num_hidden_states=3,
                  num_attention_heads=4,interaction_layers=1,dropout=0.0
              )
          )
          r=m.parameter_report()
          assert r["relation_identity_parameters"]==0
          assert r["factor_identity_parameters"]==0
          assert r["candidate_count_dependent_parameters"]==0
          assert r["runtime_step_count_dependent_parameters"]==0
          assert r["type_vocabulary_dependent_parameters"]==0
          assert r["relation_count_ceiling"] is None
          assert r["factor_count_ceiling"] is None
          assert r["runtime_step_count_ceiling"] is None
          assert r["type_vocabulary_ceiling"] is None
          assert r["shared_query_schema_token_interaction"] is True
          assert r["candidate_conditioned_multilayer_read"] is True
          assert r["continuous_relation_hypotheses"] is True
          assert r["exact_structural_sparsity"] is False
          assert r["semantic_backbone_gradient_can_flow"] is True
          print("PASS_N0_RUNTIME_SCHEMA_NO_IDENTITY_AXIS")
          PY

      - name: Prove retrospective audit reopens weak boundaries without deleting strong mechanics
        run: |
          python - <<'PY'
          import json
          a=json.load(open("configs/eipm/n0/n0_v02_full_envelope_retrospective_audit_v1.json"))
          assert "MUST_REOPEN_BEFORE_N0_CLOSURE" in a["stages"]["semantic_base"]["classification"]
          assert "PRESERVE_STRONG_ARCHITECTURE" in a["stages"]["fusion"]["classification"]
          assert "PRESERVE_STRONG_ARCHITECTURE" in a["stages"]["latent_pool"]["classification"]
          assert "PRESERVE_STRONG_ARCHITECTURE" in a["stages"]["causal_arbitration"]["classification"]
          assert "EXPERIMENTAL_OPERATING_POINT_ONLY" in a["stages"]["qsre_t1"]["classification"]
          assert "SUPERSEDED_DEFECT" in a["stages"]["qsre_t2"]["classification"]
          assert "PRESERVE_STRONG_ARCHITECTURE" in a["stages"]["production_core"]["classification"]
          assert "PRESERVE_STRONG_ARCHITECTURE" in a["stages"]["binder_v2"]["classification"]
          assert a["cross_cutting_findings"]["self_referential_validation_chain"] is True
          assert a["cross_cutting_findings"]["temporary_freezes_became_architecture_assumptions"] is True
          print("PASS_N0_RETRO_AUDIT_BOUNDARY")
          PY

      - name: Prove no gradient or GPU authorization
        run: |
          python - <<'PY'
          import json
          for path in [
              "configs/eipm/n0/n0_v02_full_envelope_retrospective_audit_v1.json",
              "configs/eipm/n0/n0_v02_semantic_operator_curriculum_contract_v1.json",
          ]:
              s=json.load(open(path))
              a=s["authorization"]
              assert a["optimizer"] is False
              assert a["gradient"] is False
              assert a["gpu"] is False
              assert a["private_identity_gradient"] is False
          print("PASS_N0_NO_PREMATURE_TRAINING_AUTHORIZATION")
          PY

      - name: Prove training plan is full architecture but still blocked from gradient
        run: |
          python - <<'PY'
          import json
          p=json.load(open("configs/eipm/n0/n0_v02_semantic_operator_joint_training_plan_v1.json"))
          assert p["architecture"]["full_architecture_every_stage"] is True
          assert p["architecture"]["reduced_pilot"] is False
          assert p["optimization_strategy"]["full_stack_cogradient_required_before_final_selection"] is True
          assert len(p["optimization_strategy"]["stages"])==3
          assert p["scaling"]["hard_parameter_ceiling"] is None
          assert p["scaling"]["hard_runtime_relation_ceiling"] is None
          assert p["scaling"]["hard_runtime_factor_ceiling"] is None
          assert p["scaling"]["hard_runtime_hop_ceiling"] is None
          assert p["authorization"]["optimizer"] is False
          assert p["authorization"]["gradient"] is False
          assert p["authorization"]["gpu_training"] is False
          print("PASS_N0_FULL_JOINT_TRAINING_PLAN_PRECOMMIT")
          PY

      - name: Prove successor final gate is behavioral not parent-cosine authority
        run: |
          python - <<'PY'
          import json
          c=json.load(open("configs/eipm/n0/n0_v02_full_envelope_final_validation_contract_v2.json"))
          assert c["authority"]["semantic_cosine_alone_can_authorize_n0"] is False
          assert c["authority"]["all_gate_sections_must_pass"] is True
          assert c["corpus"]["relation_family_holdout_required"] is True
          assert c["corpus"]["composition_extrapolation_required"] is True
          assert c["corpus"]["candidate_cardinality_extrapolation_required"] is True
          assert c["deterministic_behavior_gate"]["source_target_causal_pair_completion_min"]==1.0
          assert c["deterministic_behavior_gate"]["relation_order_causal_pair_completion_min"]==1.0
          assert c["closure"]["automatic_repair_or_rerun"] is False
          print("PASS_N0_FINAL_V2_BEHAVIORAL_AUTHORITY")
          PY

      - name: Prove reopened interface contract keeps delayed structural sparsity
        run: |
          python - <<'PY'
          import json
          i=json.load(open("configs/eipm/n0/n0_v02_full_envelope_interface_contract_v1.json"))
          assert i["foundation"]["relation_cardinality_runtime_axis"] is True
          assert i["foundation"]["factor_cardinality_runtime_axis"] is True
          assert i["evidence_graph_successor"]["remove"]==["learned_relation_id_embedding_as_semantic_authority"]
          assert i["binder_successor"]["exact_type_masks_remain_structural"] is True
          assert i["invariants"]["no_early_relation_argmax"] is True
          assert i["invariants"]["no_exact_semantic_sparsity_before_binder"] is True
          print("PASS_N0_REOPENED_INTERFACE_CONTRACT")
          PY

      - name: Prove dynamic evidence fusion latent have no runtime identity axes
        run: |
          python - <<'PY'
          from alice_personality.n0.dynamic_evidence_view_v2 import DynamicEvidenceViewV2
          from alice_personality.n0.dynamic_cross_context_fusion_v3 import DynamicCrossContextFusionV3
          from alice_personality.n0.dynamic_competitive_latent_pool_v3 import DynamicCompetitiveLatentPoolV3
          e=DynamicEvidenceViewV2().parameter_report()
          f=DynamicCrossContextFusionV3().parameter_report()
          l=DynamicCompetitiveLatentPoolV3().parameter_report()
          assert e["relation_identity_parameters"]==0
          assert e["relation_count_dependent_parameters"]==0
          assert e["pooled_only_query_conditioning"] is False
          assert f["view_identity_parameters"]==0
          assert f["view_count_dependent_parameters"]==0
          assert f["view_count_ceiling"] is None
          assert l["slot_identity_parameters"]==0
          assert l["view_identity_parameters"]==0
          assert l["slot_count_dependent_parameters"]==0
          assert l["view_count_dependent_parameters"]==0
          assert l["slot_count_ceiling"] is None
          assert l["view_count_ceiling"] is None
          print("PASS_N0_DYNAMIC_FABRIC_NO_RUNTIME_IDENTITY_AXIS")
          PY

      - name: Prove full successor stack has no serving-axis ceilings
        run: |
          python - <<'PY'
          from alice_personality.n0.n0_full_envelope_stack_v1 import N0FullEnvelopeStackV1
          r=N0FullEnvelopeStackV1().parameter_report()
          assert r["runtime_relation_ceiling"] is None
          assert r["runtime_factor_ceiling"] is None
          assert r["runtime_field_ceiling"] is None
          assert r["runtime_edge_ceiling"] is None
          assert r["runtime_view_ceiling"] is None
          assert r["runtime_slot_ceiling"] is None
          assert r["runtime_reasoning_step_ceiling"] is None
          assert r["semantic_backbone_gradient_must_remain_connected"] is True
          assert r["exact_structural_sparsity_boundary"]=="FullEnvelopeQSREBinderV1"
          print("PASS_N0_FULL_SUCCESSOR_STACK_NO_SERVING_AXIS_CEILINGS")
          PY
