name: N0 QSRE Clean-Sheet Review Contract

on:
  push:
    branches:
      - alice-eipm-v1-n0-clean-sheet-relational-execution-review
  workflow_dispatch:

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard review branch against trainable implementation drift
        run: |
          set -euo pipefail
          BASE="d5d2a4f265d5d10a0e9cb6c12c60c864d257c495"
          git cat-file -e "$BASE^{commit}"

          mapfile -t changed < <(git diff --name-only "$BASE"...HEAD)
          printf '%s\n' "${changed[@]}"

          for path in "${changed[@]}"; do
            case "$path" in
              docs/research/eipm-n0-clean-sheet-relational-execution-audit-v0.1.md|\
              docs/research/eipm-n0-relational-execution-family-comparison-v0.1.md|\
              docs/research/eipm-n0-qsre-preimplementation-contract-result-v0.1.md|\
              docs/research/eipm-n0-qsre-architecture-blueprint-v0.1.md|\
              docs/research/eipm-full-eipm-workload-envelope-v0.1.md|\
              docs/research/eipm-n0-qsre-static-mechanics-decision-v0.1.md|\
              docs/research/eipm-n0-qsre-mechanics-result-v0.1.md|\
              configs/eipm/n0/n0_v02_qsre_workload_envelope_v0_1.json|\
              configs/eipm/n0/n0_v02_qsre_static_mechanics_contract_v0_1.json|\
              configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.42.json|\
              configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.43.json|\
              evaluation/eipm/n0/n0_v02_qsre_mechanics_v0_1.jsonl|\
              scripts/eipm/n0/evaluate_n0_v02_qsre_mechanics_v0_1.py|\
              scripts/eipm/n0/run_n0_v02_qsre_mechanics_v0_1.sh|\
              .github/workflows/n0-qsre-mechanics-contract.yml|\
              src/alice_personality/n0/qsre_mechanics.py|\
              tests/eipm/test_n0_qsre_tensor_mechanics.py|\
              .github/workflows/n0-qsre-tensor-mechanics-contract.yml|\
              docs/research/eipm-n0-qsre-tensor-mechanics-result-v0.1.md|\
              configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.44.json|\
              docs/research/eipm-n0-qsre-t1-executor-decision-v0.1.md|\
              configs/eipm/n0/n0_v02_qsre_t1_executor_design_v0_1.json|\
              configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.45.json|\
              src/alice_personality/n0/qsre_t1_executor.py|\
              tests/eipm/test_n0_qsre_t1_executor.py|\
              .github/workflows/n0-qsre-t1-forward-contract.yml|\
              configs/eipm/n0/n0_v02_qsre_t1_curriculum_contract_v0_1.json|\
              scripts/eipm/n0/build_n0_v02_qsre_t1_curriculum_v0_1.py|\
              scripts/eipm/n0/evaluate_n0_v02_qsre_t1_curriculum_v0_1.py|\
              evaluation/eipm/n0/n0_v02_qsre_t1_curriculum_v0_1.jsonl|\
              .github/workflows/n0-qsre-t1-curriculum-contract.yml|\
              configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.46.json|\
              configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.39.json|\
              configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.41.json|\
              configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.40.json|\
              configs/eipm/n0/n0_v02_relational_execution_proof_obligations_v0_1.json|\
              configs/eipm/n0/n0_v02_qsre_preimplementation_diagnostics_v0_1.json|\
              evaluation/eipm/n0/n0_v02_qsre_oracle_contract_v0_1.jsonl|\
              scripts/eipm/n0/evaluate_n0_v02_qsre_oracle_contract_v0_1.py|\
              scripts/eipm/n0/run_n0_v02_qsre_oracle_contract_v0_1.sh|\
              .github/workflows/n0-qsre-clean-sheet-review-contract.yml)
                ;;
              *)
                echo "STOP: clean-sheet review branch contains unauthorized implementation drift: $path" >&2
                exit 3
                ;;
            esac
          done

          echo "review_branch_no_trainable_implementation_drift=PASS"

      - name: Syntax
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/eipm/n0/evaluate_n0_v02_qsre_oracle_contract_v0_1.py
          bash -n \
            scripts/eipm/n0/run_n0_v02_qsre_oracle_contract_v0_1.sh

      - name: Proof obligations and diagnostics complete
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          proof=json.loads(Path(
              "configs/eipm/n0/n0_v02_relational_execution_proof_obligations_v0_1.json"
          ).read_text())
          diag=json.loads(Path(
              "configs/eipm/n0/n0_v02_qsre_preimplementation_diagnostics_v0_1.json"
          ).read_text())
          state=json.loads(Path(
              "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.40.json"
          ).read_text())

          if [x["id"] for x in proof["obligations"]] != [f"P{i}" for i in range(17)]:
              raise SystemExit("P0-P16 proof obligations incomplete")
          if [x["id"] for x in diag["diagnostics"]] != [f"D{i}" for i in range(1,6)]:
              raise SystemExit("D1-D5 diagnostic contract incomplete")
          if state["selected_family"]["implementation_authorized"] is not False:
              raise SystemExit("trainable implementation authorization drift")
          if state["execution_policy"]["new_relational_model_implementation_authorized"] is not False:
              raise SystemExit("trainable implementation path opened")
          for key in (
              "optimizer_authorized",
              "gradient_authorized",
              "gpu_training_authorized",
              "heldout_opening_authorized",
              "frozen_challenge_rerun_authorized",
              "private_identity_gradient_authorized",
          ):
              if state["execution_policy"][key] is not False:
                  raise SystemExit(f"governance drift: {key}")
          print("proof_and_governance_contract=PASS")
          PY

      - name: Run deterministic QSRE oracle contract
        env:
          ALICE_N0_QSRE_ORACLE_RECEIPT: ${{ github.workspace }}/qsre_oracle_receipt.json
        run: |
          set -euo pipefail
          export ALICE_N0_REPO_ROOT="$PWD"
          bash scripts/eipm/n0/run_n0_v02_qsre_oracle_contract_v0_1.sh

      - name: Receipt remains non-training
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          r=json.loads(Path("qsre_oracle_receipt.json").read_text())
          if r["status"]!="PASS_QSRE_DETERMINISTIC_PREIMPLEMENTATION_CONTRACT":
              raise SystemExit("deterministic QSRE contract did not pass")
          for key in (
              "new_learned_parameters",
              "optimizer",
              "gradient",
              "gpu",
              "existing_model_weights_mutated",
              "causal_test_opened",
              "frozen_challenge_opened",
              "private_identity_gradient",
              "trainable_qsre_implementation_authorized",
          ):
              if r[key] is not False:
                  raise SystemExit(f"receipt boundary drift: {key}")
          print("receipt_nontraining_boundary=PASS")
          PY
