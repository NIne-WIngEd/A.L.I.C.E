name: n0-qsre-production-p2-ordered-evidence-v3-contract

on:
  push:
    paths:
      - "src/alice_personality/n0/qsre_production_operator_v3.py"
      - "tests/eipm/test_n0_qsre_production_operator_v3.py"
      - "configs/eipm/n0/n0_v02_qsre_production_training_plan_v3.json"
      - "configs/eipm/n0/n0_v02_qsre_p2_v3_recovery_contract_v1.json"
      - "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.60.json"
      - "scripts/eipm/n0/train_n0_v02_qsre_production_p2_v3.py"
      - "scripts/eipm/n0/qsre_production_training_utils.py"
      - ".github/workflows/n0-qsre-production-p2-ordered-evidence-v3-contract.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CPU dependencies
        run: python -m pip install -q torch pytest

      - name: Syntax
        run: |
          python -m py_compile src/alice_personality/n0/qsre_production_operator_v3.py
          python -m py_compile tests/eipm/test_n0_qsre_production_operator_v3.py
          python -m py_compile scripts/eipm/n0/train_n0_v02_qsre_production_p2_v3.py
          python -m py_compile scripts/eipm/n0/qsre_production_training_utils.py

      - name: Ordered-evidence mechanics
        run: |
          PYTHONPATH=src pytest -q tests/eipm/test_n0_qsre_production_operator_v3.py

      - name: Localization-bound architecture contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          plan=json.loads(Path("configs/eipm/n0/n0_v02_qsre_production_training_plan_v3.json").read_text())
          recovery=json.loads(Path("configs/eipm/n0/n0_v02_qsre_p2_v3_recovery_contract_v1.json").read_text())
          state=json.loads(Path("configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.60.json").read_text())
          source=Path("src/alice_personality/n0/qsre_production_operator_v3.py").read_text()

          assert plan["schema"]=="alice.eipm.n0.qsre-production-training-plan.v3"
          loc=plan["stages"]["P2"]["failure_localization"]
          assert loc["magnolia_job"]==575957
          assert loc["status"]=="PASS_ZERO_GRADIENT_P2_FAILURE_LOCALIZATION"
          assert loc["result_sha256"]=="da87d9436a7d4a928e45ea65582ab432c9d43254e2d1cbbaa8235ad28627e55b"
          assert loc["evidence"]["view0_active_mask_exact"]>0.95
          assert loc["evidence"]["view0_length2_identity_exact"]<0.11
          assert loc["evidence"]["length3_identity_exact"]==0.0
          assert loc["evidence"]["unknown_terminal_win_rate"]==0.0

          governance=plan["governance"]
          assert governance["p2_v2_gpu_authorization_revoked_by_localization_575957"] is True
          assert governance["p2_v3_single_architecture_recovery_run"] is True
          assert governance["automatic_rerun"] is False
          assert governance["learning_rate_search"] is False
          assert governance["step_search"] is False
          assert governance["width_search"] is False
          assert governance["private_identity_gradient"] is False

          arch=plan["operator_architecture"]
          assert arch["ordered_query_evidence_consumption"] is True
          assert arch["query_coverage_is_runtime_state"] is True
          assert arch["query_coverage_is_hop_parameter"] is False
          assert arch["left_to_right_monotonicity_assumption"] is False

          assert "query_coverage" in source
          assert "query_remaining" in source
          assert "coverage_steps" in source
          assert "hop_count_dependent_parameters" in source

          assert recovery["source_evidence"]["localization_job"]==575957
          assert recovery["v2_disposition"]["p2_v2_gpu_authorization_revoked"] is True
          assert recovery["authorization"]["p2_v3_gpu_training"] is False
          assert state["execution_policy"]["p2_v3_gpu_training_authorized"] is False
          assert state["interpretation"]["relation_identity_order_primary_bottleneck"] is True
          assert state["interpretation"]["active_survival_primary_bottleneck"] is False
          print("PASS_LOCALIZATION_BOUND_ORDERED_EVIDENCE_V3_CONTRACT")
          PY
