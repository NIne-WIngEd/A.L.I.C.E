name: n0-qsre-t2-one-shot-authorization

on:
  push:
    paths:
      - "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.52.json"
      - "configs/eipm/n0/n0_v02_qsre_t2_training_contract_v0_1.json"
      - "scripts/eipm/n0/train_n0_v02_qsre_t2_operator_v0_1.py"
      - "scripts/eipm/n0/run_n0_v02_qsre_t2_operator_training_v0_1.sh"
      - "scripts/eipm/n0/magnolia_p100_n0_v02_qsre_t2_operator_training_v0_1.sbatch"
      - ".github/workflows/n0-qsre-t2-one-shot-authorization.yml"
  workflow_dispatch:

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Syntax
        run: |
          python -m py_compile scripts/eipm/n0/train_n0_v02_qsre_t2_operator_v0_1.py
          bash -n scripts/eipm/n0/run_n0_v02_qsre_t2_operator_training_v0_1.sh
          bash -n scripts/eipm/n0/magnolia_p100_n0_v02_qsre_t2_operator_training_v0_1.sbatch

      - name: Governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state=json.loads(Path("configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.52.json").read_text())
          contract=json.loads(Path("configs/eipm/n0/n0_v02_qsre_t2_training_contract_v0_1.json").read_text())

          assert state["resolved_preparation_boundary"]["status"] == "PASS_QSRE_T2_TOKENIZED_PREPARATION"
          assert state["resolved_preparation_boundary"]["prepared_cache_sha256"] == "774722d57ccaacc7dba8e53ff3aec66bc4b4b5c6efd20db6907ac5a70654e781"
          assert state["resolved_preparation_boundary"]["preparation_receipt_sha256"] == "52e1e0599ecda2992dd2476305c377a4645a7ad079fc6e7ea660684fa35a5967"

          policy=state["execution_policy"]
          assert policy["t2_operator_training_authorized"] is True
          assert policy["optimizer_authorized"] is True
          assert policy["gradient_authorized"] is True
          assert policy["gpu_training_authorized"] is True
          assert policy["max_gpu_training_runs"] == 1
          assert policy["automatic_rerun_authorized"] is False
          assert policy["automatic_hotfix_chain_authorized"] is False
          assert policy["semantic_backbone_gradient_authorized"] is False
          assert policy["t1_executor_gradient_authorized"] is False
          assert policy["learned_support_training_authorized"] is False
          assert policy["causal_test_opening_authorized"] is False
          assert policy["frozen_challenge_opening_authorized"] is False
          assert policy["private_identity_gradient_authorized"] is False

          assert contract["schema"] == "alice.eipm.n0.qsre-t2-training-contract.v0.1"
          assert contract["expected_prepared_cache_sha256"] == "774722d57ccaacc7dba8e53ff3aec66bc4b4b5c6efd20db6907ac5a70654e781"
          assert contract["semantic_checkpoint_sha256"] == "6c2706984c0e05123c4d88ba456788fbd4c9e7f0fca41d43d9e575ac6e53bf43"
          assert contract["t1_checkpoint_sha256"] == "483bd59499e9bea890072af9c01c12961f41504d48f988ae3b3ee9a3ae8154fb"
          assert contract["gpu_training_authorized"] is True
          assert contract["max_gpu_runs"] == 1
          assert contract["automatic_rerun"] is False
          assert contract["automatic_hotfix"] is False
          assert contract["causal_test_open"] is False
          assert contract["frozen_challenge_open"] is False
          assert contract["semantic_backbone_gradient"] is False
          assert contract["t1_executor_gradient"] is False
          assert contract["learned_support"] is False
          assert contract["private_identity_gradient"] is False
          assert contract["selection"] == "first_eligible_dev_checkpoint_then_stop"

          print("PASS_QSRE_T2_ONE_SHOT_GOVERNANCE")
          PY

      - name: Scientific source binding
        run: |
          CORE=9924227e7e7d7f3b26c2e294b5a3dde455b4cb12
          git fetch --no-tags --depth=1 origin "$CORE"
          for path in             configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.52.json             configs/eipm/n0/n0_v02_qsre_t2_training_contract_v0_1.json             scripts/eipm/n0/train_n0_v02_qsre_t2_operator_v0_1.py             src/alice_personality/n0/qsre_t2_operator.py
          do
            git diff --quiet "$CORE" HEAD -- "$path" || {
              echo "Scientific source drift: $path"
              exit 1
            }
          done
          grep -q 'AUTHORIZED_CORE="9924227e7e7d7f3b26c2e294b5a3dde455b4cb12"'             scripts/eipm/n0/run_n0_v02_qsre_t2_operator_training_v0_1.sh

      - name: Trainer mechanics self-test
        run: |
          python -m pip install -q torch
          PYTHONPATH=src python scripts/eipm/n0/train_n0_v02_qsre_t2_operator_v0_1.py --self-test
