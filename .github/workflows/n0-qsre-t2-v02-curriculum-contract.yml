name: n0-qsre-t2-v02-curriculum-contract

on:
  push:
    paths:
      - "configs/eipm/n0/n0_v02_qsre_t2_curriculum_contract_v0_2.json"
      - "scripts/eipm/n0/build_n0_v02_qsre_t2_operator_curriculum_v0_2.py"
      - "scripts/eipm/n0/build_n0_v02_qsre_operator_reality_corpus_v0_1.py"
      - "scripts/eipm/n0/build_n0_v02_qsre_t2_operator_challenge_v0_2.py"
      - "scripts/eipm/n0/audit_n0_v02_qsre_t2_shortcuts_v0_1.py"
      - ".github/workflows/n0-qsre-t2-v02-curriculum-contract.yml"
  workflow_dispatch:

jobs:
  curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          python -m py_compile             scripts/eipm/n0/build_n0_v02_qsre_t2_operator_curriculum_v0_2.py             scripts/eipm/n0/audit_n0_v02_qsre_t2_shortcuts_v0_1.py

      - name: Build exact T1 and realistic T2 v0.2
        run: |
          python scripts/eipm/n0/build_n0_v02_qsre_t1_curriculum_v0_2.py             --contract configs/eipm/n0/n0_v02_qsre_t1_curriculum_contract_v0_2.json             --output /tmp/t1.jsonl
          python scripts/eipm/n0/build_n0_v02_qsre_t2_operator_curriculum_v0_2.py             --contract configs/eipm/n0/n0_v02_qsre_t2_curriculum_contract_v0_2.json             --t1-curriculum /tmp/t1.jsonl             --output /tmp/t2v02.jsonl
          python scripts/eipm/n0/build_n0_v02_qsre_operator_reality_corpus_v0_1.py             --output /tmp/reality.jsonl

      - name: Verify lineage and pair semantics
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict

          def read(path):
              return [json.loads(x) for x in open(path) if x.strip()]

          t1=read("/tmp/t1.jsonl")
          t2=read("/tmp/t2v02.jsonl")
          by_t1={r["id"]:r for r in t1}
          groups=defaultdict(list)
          for r in t2:
              groups[r["source_t1_row_id"]].append(r)
              src=by_t1[r["source_t1_row_id"]]
              relational=src["expected_control"]=="RELATIONAL"
              expected_seq=[int(x) for x in src["operator"]["relation_sequence_id"]] if relational else []
              expected_role=int(src["operator"]["role_id"]) if relational else 3
              expected_op=int(src["operator"]["operation_id"]) if relational else 0
              expected_control={"FALLBACK":0,"RELATIONAL":1,"DEFER":2}[src["expected_control"]]
              got=r["operator_target"]
              assert got["relation_sequence_id"]==expected_seq
              assert got["role_id"]==expected_role
              assert got["operation_id"]==expected_op
              assert got["control_id"]==expected_control
              assert r["private_identity_data"] is False
              assert r["training_authorized"] is False

          assert len(t2)==1008
          assert sum(r["split"]=="train" for r in t2)==720
          assert sum(r["split"]=="dev" for r in t2)==288
          assert all(len(rows)==2 for rows in groups.values())
          assert sum(bool(r["cue_collision"]) for r in t2) >= 100
          print("PASS_QSRE_T2_V02_LINEAGE_AND_PAIR_SEMANTICS")
          PY

      - name: Shallow shortcut and reality transfer diagnostics
        run: |
          python scripts/eipm/n0/audit_n0_v02_qsre_t2_shortcuts_v0_1.py             --t2-curriculum /tmp/t2v02.jsonl             --reality-corpus /tmp/reality.jsonl             --output /tmp/shortcut.json
          python - <<'PY'
          import json
          r=json.load(open("/tmp/shortcut.json"))
          print(json.dumps(r["summary"],indent=2,sort_keys=True))
          print("DEV_HEADS="+json.dumps({
              k:v["unigram_nb"]
              for k,v in r["t2_train_to_t2_dev"].items()
          },sort_keys=True))
          print("REALITY_HEADS="+json.dumps({
              k:v["unigram_nb"]
              for k,v in r["t2_train_to_reality"].items()
          },sort_keys=True))
          PY
