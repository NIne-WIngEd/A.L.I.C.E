name: n0-qsre-t2-v03-frozen-contract

on:
  push:
    paths:
      - "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.59.json"
      - "configs/eipm/n0/n0_v02_qsre_t2_relation_schema_v0_1.json"
      - "src/alice_personality/n0/qsre_t2_schema_ordered_operator.py"
      - "tests/eipm/test_n0_qsre_t2_schema_ordered_operator.py"
      - "scripts/eipm/n0/run_n0_v02_qsre_t2_schema_ordered_train_v0_3.sh"
      - "scripts/eipm/n0/magnolia_p100_n0_v02_qsre_t2_schema_ordered_v0_3.sbatch"
      - "scripts/eipm/n0/launch_n0_v02_qsre_t2_schema_ordered_pipeline_v0_3.sh"
      - ".github/workflows/n0-qsre-t2-v03-schema-ordered-contract.yml"
  workflow_dispatch:

jobs:
  frozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static diagnostic prototype still imports
        run: |
          python -m py_compile src/alice_personality/n0/qsre_t2_schema_ordered_operator.py
          python -m pip install -q torch pytest
          PYTHONPATH=src pytest -q tests/eipm/test_n0_qsre_t2_schema_ordered_operator.py

      - name: T2 v0.3 GPU paths fail closed
        run: |
          set +e
          bash scripts/eipm/n0/launch_n0_v02_qsre_t2_schema_ordered_pipeline_v0_3.sh >/tmp/launch.out 2>/tmp/launch.err
          LAUNCH_RC=$?
          bash scripts/eipm/n0/run_n0_v02_qsre_t2_schema_ordered_train_v0_3.sh >/tmp/train.out 2>/tmp/train.err
          TRAIN_RC=$?
          bash scripts/eipm/n0/magnolia_p100_n0_v02_qsre_t2_schema_ordered_v0_3.sbatch >/tmp/sbatch.out 2>/tmp/sbatch.err
          SBATCH_RC=$?
          set -e
          cat /tmp/launch.err
          cat /tmp/train.err
          cat /tmp/sbatch.err
          test "$LAUNCH_RC" -eq 90
          test "$TRAIN_RC" -eq 90
          test "$SBATCH_RC" -eq 90
          grep -F "state v0.59" /tmp/launch.err
          grep -F "revoked by N0 state v0.59" /tmp/train.err
          grep -F "revoked by N0 state v0.59" /tmp/sbatch.err

      - name: Architecture-closure state
        run: |
          python - <<'PY'
          import json
          s=json.load(open("configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.59.json"))
          assert s["schema"]=="alice.eipm.n0.latent-pool-stage-state.v0.59"
          assert s["correction"]["t2_v03_gpu_run_occurred"] is False
          assert s["correction"]["t2_v03_gpu_authorization_revoked"] is True
          p=s["execution_policy"]
          assert p["t2_v03_gpu_training_authorized"] is False
          assert p["t2_v03_direct_p100_launch_authorized"] is False
          assert p["t2_v03_pipeline_launch_authorized"] is False
          assert p["automatic_rerun_authorized"] is False
          assert p["automatic_hotfix_chain_authorized"] is False
          assert s["required_next_architecture"]=="QSRE_PRODUCTION_CORE_V1"
          print("PASS_T2_V03_FROZEN_PENDING_PRODUCTION_ARCHITECTURE_CLOSURE")
          PY
