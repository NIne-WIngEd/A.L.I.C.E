name: N0 QSRE Tensor Mechanics Contract

on:
  push:
    branches:
      - alice-eipm-v1-n0-clean-sheet-relational-execution-review
    paths:
      - "src/alice_personality/n0/qsre_mechanics.py"
      - "tests/eipm/test_n0_qsre_tensor_mechanics.py"
      - "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.43.json"
      - ".github/workflows/n0-qsre-tensor-mechanics-contract.yml"
  workflow_dispatch:

jobs:
  tensor-mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU tensor runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.7" --index-url https://download.pytorch.org/whl/cpu

      - name: Static no-training boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          t=Path("src/alice_personality/n0/qsre_mechanics.py").read_text()
          required=[
              "class QSRETensorInputs",
              "class QSREQueryOperatorState",
              "masked_sparsemax",
              "role_incidence",
              "support_local_field_mask",
              "support_local_softmax",
              "qsre_control_state",
          ]
          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit("tensor mechanics missing "+repr(missing))

          forbidden=[
              "nn.Parameter",
              "torch.optim",
              ".backward(",
              "optimizer.step",
              'torch.device("cuda")',
              ".cuda()",
          ]
          present=[x for x in forbidden if x in t]
          if present:
              raise SystemExit("trainable/GPU construct leaked "+repr(present))
          print("tensor_mechanics_static_boundary=PASS")
          PY

      - name: State authorizes only tensor mechanics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          s=json.loads(Path(
              "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.43.json"
          ).read_text())

          if s["schema"]!="alice.eipm.n0.latent-pool-stage-state.v0.43":
              raise SystemExit("v0.43 state drift")
          if s["tensor_mechanics_scope"]["authorized"] is not True:
              raise SystemExit("tensor mechanics not authorized")
          if s["trainable_qsre_implementation_authorized"] is not False:
              raise SystemExit("trainable QSRE implementation opened")

          forbidden=[
              "nn.Parameter",
              "learned projection",
              "trainable Query Operator Encoder",
              "trainable binder",
              "trainable node-edge executor",
              "trainable structural readout",
              "optimizer",
              "backward",
              "GPU training",
              "TEST",
              "frozen challenge",
          ]
          if s["tensor_mechanics_scope"]["forbidden"] != forbidden:
              raise SystemExit("tensor mechanics forbidden-scope drift")
          print("tensor_mechanics_state_boundary=PASS")
          PY

      - name: Run tensor mechanics tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python tests/eipm/test_n0_qsre_tensor_mechanics.py

      - name: Confirm no learned parameters by construction
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python - <<'PY'
          import inspect
          import alice_personality.n0.qsre_mechanics as q

          source=inspect.getsource(q)
          if "Parameter(" in source or "Module(" in source:
              raise SystemExit("learned module construct detected")
          print("tensor_mechanics_no_learned_parameters=PASS")
          PY
