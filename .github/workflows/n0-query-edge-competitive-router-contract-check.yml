name: N0 Query Edge Competitive Router Contract Check

on:
  push:
    branches:
      - alice-eipm-v1-query-edge-competitive-router
    paths:
      - "src/alice_personality/n0/query_edge_competitive_router_bridge.py"
      - "src/alice_personality/n0/evidence_graph_query_edge_competitive_router.py"
      - "scripts/eipm/n0/qualify_n0_v02_query_edge_competitive_router_v0_1.py"
      - "scripts/eipm/n0/run_n0_v02_qualify_query_edge_competitive_router_v0_1.sh"
      - "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.26.json"
      - "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.27.json"
      - ".github/workflows/n0-query-edge-competitive-router-contract-check.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax
        run: |
          set -euo pipefail
          python -m py_compile             src/alice_personality/n0/query_edge_competitive_router_bridge.py             src/alice_personality/n0/evidence_graph_query_edge_competitive_router.py             scripts/eipm/n0/qualify_n0_v02_query_edge_competitive_router_v0_1.py
          bash -n scripts/eipm/n0/run_n0_v02_qualify_query_edge_competitive_router_v0_1.sh

      - name: Source failure and CPU-only state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path(
              "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.27.json"
          ).read_text())
          if s["schema"]!="alice.eipm.n0.latent-pool-stage-state.v0.27":
              raise SystemExit("v0.27 schema drift")
          f=s["source_failure"]
          if f["magnolia_job_id"]!=575888:
              raise SystemExit("source failure job drift")
          if f["result_sha256"]!="99fc21394bdfbb8e3500bf0efa7c3ce836a2e071b8b11a1c733f73aa99b6fea2":
              raise SystemExit("source failure hash drift")
          if f["rerun_authorized"] is not False:
              raise SystemExit("failed experiment reopened")
          e=s["execution_policy"]
          if e["cpu_no_gradient_runtime_qualification_authorized"] is not True:
              raise SystemExit("CPU qualification not authorized")
          for key in (
              "optimizer_authorized",
              "gradient_authorized",
              "gpu_training_authorized",
              "automatic_rerun_authorized",
              "automatic_hotfix_authorized",
              "heldout_opening_authorized",
              "frozen_challenge_rerun_authorized",
              "scale_authorized",
              "semantic_retraining_authorized",
              "graph_parent_retraining_authorized",
              "private_identity_gradient_authorized",
              "production_promotion_authorized",
          ):
              if e[key] is not False:
                  raise SystemExit(f"premature authorization: {key}")
          if s["n0_complete"] is not False:
              raise SystemExit("N0 completion drift")
          print("source_failure_and_cpu_only_state=PASS")
          PY

      - name: Competitive route is actual runtime control
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path(
              "src/alice_personality/n0/query_edge_competitive_router_bridge.py"
          ).read_text()
          required=[
              "CompetitiveQueryEdgeBridge",
              "self.route_head",
              "self.noop_route_logit",
              "route_logits_with_noop",
              "route_probabilities = torch.softmax(route_logits_with_noop",
              "edge_route_probability = route_probabilities[:, 1:]",
              "source_residual = edge_route_probability * source_proposal",
              "target_residual = edge_route_probability * target_proposal",
              "nn.init.zeros_(self.source_residual_read.weight)",
              "nn.init.zeros_(self.target_residual_read.weight)",
              "nn.init.zeros_(route_final.weight)",
              '"competitive_edge_routing": True',
              '"explicit_parent_noop_route": True',
              '"supervised_route_equals_runtime_contribution_route": True',
              '"independent_per_edge_tanh_gate": False',
              '"proxy_dot_product_router": False',
              '"hard_parameter_ceiling": None',
          ]
          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit("competitive route contract missing "+repr(missing))
          forbidden=[
              "self.gate =",
              "torch.tanh(gate_logit)",
              "edge_specialist_gate",
              "routing_scores(",
              "einsum(\"bew,bew->be\"",
          ]
          present=[x for x in forbidden if x in t]
          if present:
              raise SystemExit("rejected proxy/independent gate leaked "+repr(present))
          print("competitive_route_is_runtime_control=PASS")
          PY

      - name: Frozen parent integration
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path(
              "src/alice_personality/n0/evidence_graph_query_edge_competitive_router.py"
          ).read_text()
          required=[
              "CompetitiveQueryEdgeEvidenceGraphEncoder",
              "DualEndpointEvidenceGraphEncoder",
              "super()._query_conditioned_relation_bias",
              'source_delta = bridge["source_residual"]',
              'target_delta = bridge["target_residual"]',
              "parent_relation_bias + bridge_bias",
              "freeze_parent_for_bridge_training",
              'name.startswith("competitive_query_edge_bridge.")',
              '"competitive_edge_routing"] = True',
              '"explicit_parent_noop_route"] = True',
              '"supervised_route_equals_runtime_contribution_route"] = True',
              '"hard_parameter_ceiling"] = None',
          ]
          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit("competitive integration missing "+repr(missing))
          for forbidden in ("interface_endpoint_read","query_relation_role_router"):
              if forbidden in t:
                  raise SystemExit("rejected older router leaked: "+forbidden)
          print("frozen_parent_competitive_integration=PASS")
          PY

      - name: No-gradient qualifier probes actual route control
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          q=Path(
              "scripts/eipm/n0/qualify_n0_v02_query_edge_competitive_router_v0_1.py"
          ).read_text()
          required=[
              "PASS_COMPETITIVE_EDGE_ROUTER_NO_GRADIENT_RUNTIME_CONTRACT",
              "99fc21394bdfbb8e3500bf0efa7c3ce836a2e071b8b11a1c733f73aa99b6fea2",
              "torch.device(\"cpu\")",
              "torch.inference_mode()",
              "route_probabilities_sum_to_one",
              "explicit_parent_noop_route",
              "route_probability_is_actual_source_contribution_control",
              "route_probability_is_actual_target_contribution_control",
              "probe.competitive_query_edge_bridge.source_residual_read.bias.fill_(1.0)",
              "probe.competitive_query_edge_bridge.target_residual_read.bias.fill_(-1.0)",
              '"optimizer_created": False',
              '"gradient_performed": False',
              '"gpu_required": False',
              '"training_authorized": False',
          ]
          missing=[x for x in required if x not in q]
          if missing:
              raise SystemExit("competitive qualifier missing "+repr(missing))
          forbidden=[
              "torch.optim",
              ".backward(",
              "optimizer.step",
              'torch.device("cuda")',
              ".cuda()",
          ]
          present=[x for x in forbidden if x in q]
          if present:
              raise SystemExit("training leaked into qualifier "+repr(present))
          print("no_gradient_route_control_probe=PASS")
          PY

      - name: Qualification runner exact lineage and no training
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          r=Path(
              "scripts/eipm/n0/run_n0_v02_qualify_query_edge_competitive_router_v0_1.sh"
          ).read_text()
          required=[
              "99fc21394bdfbb8e3500bf0efa7c3ce836a2e071b8b11a1c733f73aa99b6fea2",
              "3ae08aa2fc2c46ed74a47792310c6c2bf202fad800549cecc36c5365523dc47f",
              "c3618a6022519af2a6a140f8b571281c68735fd1412c3ffa904979e9bbea2dcb",
              "0d05f1dcd7d11cc1defdd0a4112c10e3b1d7febfaabf97fe611a854d6905b99a",
              "f5b3f438f776216f6dbd557a8c785aac70af38d256e3f7cf94f0f71a43f53e94",
              "ac0e5e28749cbb1e8dda62262c4c2761db887b965cbc3a74493ff6c9b5355304",
              "v0_27_competitive_router_cpu_qualification_gate=PASS",
          ]
          missing=[x for x in required if x not in r]
          if missing:
              raise SystemExit("qualification runner binding missing "+repr(missing))
          for forbidden in ("sbatch","torch.optim",".backward(","optimizer.step"):
              if forbidden in r:
                  raise SystemExit("training leaked into CPU runner: "+forbidden)
          print("qualification_runner_exact_lineage=PASS")
          PY
