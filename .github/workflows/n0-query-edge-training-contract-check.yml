name: N0 Query Edge Training Contract Check

on:
  push:
    branches:
      - alice-eipm-v1-query-edge-cross-attention-bridge
    paths:
      - "scripts/eipm/n0/train_n0_v02_query_edge_cross_attention_bridge_v0_1.py"
      - "scripts/eipm/n0/run_n0_v02_query_edge_cross_attention_bridge_training_v0_1.sh"
      - "scripts/eipm/n0/magnolia_p100_n0_v02_query_edge_cross_attention_bridge_training_v0_1.sbatch"
      - "configs/eipm/n0/n0_v02_query_edge_training_decision_v0_1.json"
      - "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.24.json"
      - ".github/workflows/n0-query-edge-training-contract-check.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax
        run: |
          set -euo pipefail
          python -m py_compile             scripts/eipm/n0/train_n0_v02_query_edge_cross_attention_bridge_v0_1.py
          bash -n             scripts/eipm/n0/run_n0_v02_query_edge_cross_attention_bridge_training_v0_1.sh
          bash -n             scripts/eipm/n0/magnolia_p100_n0_v02_query_edge_cross_attention_bridge_training_v0_1.sbatch

      - name: Exact qualification and one-run state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path(
              "configs/eipm/n0/n0_v02_query_edge_training_decision_v0_1.json"
          ).read_text())
          s=json.loads(Path(
              "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.24.json"
          ).read_text())

          expected={
              "qualification_receipt_sha256":"b1e073fc6226ac3f3aa88ed10d4ed31059b6e27b0338aa7738c686239f33624f",
              "curriculum_sha256":"c3618a6022519af2a6a140f8b571281c68735fd1412c3ffa904979e9bbea2dcb",
              "curriculum_manifest_sha256":"0d05f1dcd7d11cc1defdd0a4112c10e3b1d7febfaabf97fe611a854d6905b99a",
              "preservation_train_anchors_sha256":"f5b3f438f776216f6dbd557a8c785aac70af38d256e3f7cf94f0f71a43f53e94",
              "parent_graph_sha256":"3ae08aa2fc2c46ed74a47792310c6c2bf202fad800549cecc36c5365523dc47f",
              "parent_adapter_sha256":"50eeeea3dfff5b6bddaa8da667b6b6c2f917dc668b1acd0410923822ae5ad2df",
          }
          for k,v in expected.items():
              if d.get(k)!=v:
                  raise SystemExit(f"training decision hash drift: {k}")
          if d["decision"]!="AUTHORIZE_ONE_BOUNDED_QUERY_EDGE_BRIDGE_EXPERIMENT_AFTER_RUNTIME_QUALIFICATION":
              raise SystemExit("training decision drift")
          if d["operating_budget"]["max_training_runs"]!=1:
              raise SystemExit("one-run boundary drift")
          if d["training_objective"]["gradient_surgery"] is not False:
              raise SystemExit("unreviewed gradient surgery entered objective")

          if s["schema"]!="alice.eipm.n0.latent-pool-stage-state.v0.24":
              raise SystemExit("v0.24 schema drift")
          q=s["runtime_qualification"]
          if q["receipt_sha256"]!=expected["qualification_receipt_sha256"]:
              raise SystemExit("qualification receipt drift")
          for k in (
              "parent_parameters_exactly_unchanged",
              "exact_parent_field_weights",
              "exact_parent_pooled_state",
              "zero_initialized_specialist_gate",
              "same_relation_edges_produce_distinct_edge_queries",
              "edge_content_conditions_query_token_attention",
          ):
              if q[k] is not True:
                  raise SystemExit(f"qualification invariant drift: {k}")
          if q["forced_antisymmetry"] is not False:
              raise SystemExit("forced antisymmetry returned")

          e=s["execution_policy"]
          if e["gpu_training_runs_remaining"]!=1:
              raise SystemExit("GPU run count drift")
          if e["gradient_execution_authorized_now"] is not True:
              raise SystemExit("gradient not authorized")
          if e["gpu_execution_authorized_now"] is not True:
              raise SystemExit("GPU not authorized")
          for k in (
              "automatic_rerun_authorized",
              "automatic_hotfix_authorized",
              "automatic_heldout_opening_authorized",
              "heldout_opening_authorized",
              "frozen_challenge_rerun_authorized",
              "scale_authorized",
              "semantic_retraining_authorized",
              "graph_parent_retraining_authorized",
              "private_identity_gradient_authorized",
              "production_promotion_authorized",
          ):
              if e[k] is not False:
                  raise SystemExit(f"premature authorization: {k}")
          if s["n0_complete"] is not False:
              raise SystemExit("N0 completion drift")
          print("exact_qualification_and_one_run_state=PASS")
          PY

      - name: Training objective contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path(
              "scripts/eipm/n0/train_n0_v02_query_edge_cross_attention_bridge_v0_1.py"
          ).read_text()
          required=[
              "QueryEdgeBridgeEvidenceGraphEncoder",
              "QueryEdgeCrossAttentionBridge",
              "relevant_edge_index",
              "same_relation_edge_mask",
              "routing_loss",
              "routing_scores",
              "distill_kl",
              "irrelevant_gate_loss",
              "preservation_train_anchors_used_for_gradient",
              '"preservation_dev_rows_used_for_gradient": False',
              '"causal_test_split_evaluated": False',
              '"frozen_challenge_evaluated": False',
              '"gradient_surgery": False',
              '"automatic_rerun_or_hotfix_authorized": False',
              "freeze_parent_for_bridge_training",
              'exclude_prefixes=("query_edge_bridge.",)',
          ]
          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit("training objective contract missing "+repr(missing))

          forbidden=[
              "PCGrad",
              "project_conflicting",
              "SemanticRoleResidualEvidenceGraphEncoder",
              "RelationConditionedMultiLayerEvidenceGraphEncoder(",
              "query_relation_role_router",
              "interface_endpoint_read",
              "test_quads = QueryEdgeQuadDataset(causal, \"test\")",
          ]
          present=[x for x in forbidden if x in t]
          if present:
              raise SystemExit("rejected or unreviewed mechanism leaked "+repr(present))
          print("training_objective_contract=PASS")
          PY

      - name: Routing supervision is same-relation edge binding
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path(
              "scripts/eipm/n0/train_n0_v02_query_edge_cross_attention_bridge_v0_1.py"
          ).read_text()
          required=[
              'scores = routing_scores(out)',
              'mask = batch["same_relation_edge_mask"].bool()',
              'scores = scores.masked_fill(~mask, -1.0e4)',
              'F.cross_entropy(scores, batch["relevant_edge_index"].long())',
              'float(current["routing_accuracy"]) > 0.5',
              '>= (1.0 / 3.0)',
          ]
          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit("routing supervision drift "+repr(missing))
          print("same_relation_routing_supervision=PASS")
          PY

      - name: Parent distillation uses TRAIN anchors only
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path(
              "scripts/eipm/n0/train_n0_v02_query_edge_cross_attention_bridge_v0_1.py"
          ).read_text()
          required=[
              'anchors["ordinary"]["train_anchor_ids"]',
              'anchors["endpoint"]["train_anchor_ids"]',
              'ordinary_train = ml.RowHiddenDataset',
              'endpoint_train = ml.RowHiddenDataset',
              'teacher = parent_forward(baseline_graph, adapter, preserve)',
              'kl = distill_kl(student["field_weights"], teacher["field_weights"])',
              '0.5 * args.preservation_weight * kl',
          ]
          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit("parent distillation contract missing "+repr(missing))
          if '"dev_rows_may_be_used_for_gradient"] is not False' not in t:
              raise SystemExit("DEV gradient exclusion guard missing")
          if '"heldout_or_test_rows_may_be_used_for_gradient"] is not False' not in t:
              raise SystemExit("heldout gradient exclusion guard missing")
          print("train_only_parent_distillation=PASS")
          PY

      - name: Runner binds exact artifacts and claims run
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          r=Path(
              "scripts/eipm/n0/run_n0_v02_query_edge_cross_attention_bridge_training_v0_1.sh"
          ).read_text()
          required=[
              "b1e073fc6226ac3f3aa88ed10d4ed31059b6e27b0338aa7738c686239f33624f",
              "c3618a6022519af2a6a140f8b571281c68735fd1412c3ffa904979e9bbea2dcb",
              "0d05f1dcd7d11cc1defdd0a4112c10e3b1d7febfaabf97fe611a854d6905b99a",
              "f5b3f438f776216f6dbd557a8c785aac70af38d256e3f7cf94f0f71a43f53e94",
              "3ae08aa2fc2c46ed74a47792310c6c2bf202fad800549cecc36c5365523dc47f",
              "50eeeea3dfff5b6bddaa8da667b6b6c2f917dc668b1acd0410923822ae5ad2df",
              "d485fce0e4304d9cbd8af1658ed7cfedfd1bd4d44b0f40cf56a2618d5ad2390b",
              "fb88b9580e38a648101277815f82c3ba60c19f3bfd16dbe3029ded40b04aea56",
              "query_edge_one_p100_training_gate=PASS",
              'mkdir "$TRAIN_ROOT"',
              "--routing-weight 0.50",
              "--preservation-weight 1.0",
              "--irrelevant-gate-weight 0.05",
          ]
          missing=[x for x in required if x not in r]
          if missing:
              raise SystemExit("runner binding missing "+repr(missing))
          if r.count('EXPECTED_PARENT_ADAPTER_SHA256=')!=1:
              raise SystemExit("parent adapter hash binding must be unique")
          print("runner_exact_bindings_and_one_run_claim=PASS")
          PY

      - name: P100 job is training-only and bounded
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path(
              "scripts/eipm/n0/magnolia_p100_n0_v02_query_edge_cross_attention_bridge_training_v0_1.sbatch"
          ).read_text()
          required=[
              "#SBATCH --gres=gpu:p100:1",
              "#SBATCH --time=01:30:00",
              "RAYAN_UDOCKER_NVIDIA=1",
              "Expected P100",
              "run_n0_v02_query_edge_cross_attention_bridge_training_v0_1.sh",
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit("P100 wrapper drift "+repr(missing))
          if "#SBATCH --nodes=1" not in s or "#SBATCH --ntasks=1" not in s:
              raise SystemExit("P100 job shape drift")
          print("bounded_p100_wrapper=PASS")
          PY
