name: N0 Relation Conditioned MultiLayer Interface Contract Check

on:
  push:
    branches:
      - alice-eipm-v1-relation-conditioned-multilayer-interface
    paths:
      - "src/alice_personality/n0/relation_conditioned_multilayer_query.py"
      - "scripts/eipm/n0/compile_n0_v02_relation_conditioned_layer_map_v0_1.py"
      - "scripts/eipm/n0/run_n0_v02_compile_relation_conditioned_layer_map_v0_1.sh"
      - "scripts/eipm/n0/qualify_n0_v02_relation_conditioned_multilayer_interface_v0_1.py"
      - "scripts/eipm/n0/run_n0_v02_qualify_relation_conditioned_multilayer_interface_v0_1.sh"
      - "scripts/eipm/n0/build_n0_v02_relation_conditioned_multilayer_interface_curriculum_v0_1.py"
      - "scripts/eipm/n0/run_n0_v02_prepare_relation_conditioned_multilayer_causal_study_v0_1.sh"
      - "configs/eipm/n0/n0_v02_relation_conditioned_multilayer_preservation_contract_v0_1.json"
      - "docs/research/eipm-n0-relation-conditioned-multilayer-causal-interface-study-v0.1.md"
      - "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.19.json"
      - "scripts/eipm/n0/magnolia_udocker_exec.sh"
      - "docs/research/eipm-n0-relation-conditioned-multilayer-query-interface-v0.1.md"
      - "docs/research/eipm-n0-relation-conditioned-multilayer-interface-runtime-qualification-v0.1.md"
      - "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.17.json"
      - "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.18.json"
      - "src/alice_personality/n0/evidence_graph_multilayer_interface.py"
      - "scripts/eipm/n0/calibrate_n0_v02_multilayer_preservation_v0_1.py"
      - "scripts/eipm/n0/run_n0_v02_calibrate_multilayer_preservation_v0_1.sh"
      - "scripts/eipm/n0/train_n0_v02_relation_conditioned_multilayer_interface_v0_1.py"
      - "scripts/eipm/n0/run_n0_v02_relation_conditioned_multilayer_interface_v0_1.sh"
      - "scripts/eipm/n0/magnolia_p100_n0_v02_relation_conditioned_multilayer_interface_v0_1.sbatch"
      - "configs/eipm/n0/n0_v02_relation_conditioned_multilayer_training_decision_v0_1.json"
      - "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.20.json"
      - "docs/research/eipm-n0-relation-conditioned-multilayer-training-decision-v0.1.md"
      - ".github/workflows/n0-relation-conditioned-multilayer-interface-contract-check.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/eipm/n0/compile_n0_v02_relation_conditioned_layer_map_v0_1.py \
            scripts/eipm/n0/qualify_n0_v02_relation_conditioned_multilayer_interface_v0_1.py \
            scripts/eipm/n0/build_n0_v02_relation_conditioned_multilayer_interface_curriculum_v0_1.py \
            scripts/eipm/n0/calibrate_n0_v02_multilayer_preservation_v0_1.py \
            scripts/eipm/n0/train_n0_v02_relation_conditioned_multilayer_interface_v0_1.py \
            src/alice_personality/n0/relation_conditioned_multilayer_query.py \
            src/alice_personality/n0/evidence_graph_multilayer_interface.py
          bash -n scripts/eipm/n0/run_n0_v02_compile_relation_conditioned_layer_map_v0_1.sh
          bash -n scripts/eipm/n0/run_n0_v02_qualify_relation_conditioned_multilayer_interface_v0_1.sh
          bash -n scripts/eipm/n0/run_n0_v02_prepare_relation_conditioned_multilayer_causal_study_v0_1.sh
          bash -n scripts/eipm/n0/run_n0_v02_calibrate_multilayer_preservation_v0_1.sh
          bash -n scripts/eipm/n0/run_n0_v02_relation_conditioned_multilayer_interface_v0_1.sh
          bash -n scripts/eipm/n0/magnolia_p100_n0_v02_relation_conditioned_multilayer_interface_v0_1.sbatch
          bash -n scripts/eipm/n0/magnolia_udocker_exec.sh

      - name: Layer map compiler governance
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path("scripts/eipm/n0/compile_n0_v02_relation_conditioned_layer_map_v0_1.py").read_text()
          required=[
            "alice.eipm.n0.relation-conditioned-layer-map.v0.1",
            "COMPILED_FROM_FROZEN_LAYERWISE_AUDIT",
            "exact_best_layers",
            "near_best_layers_within_one_accuracy_quantum",
            "candidate_layers",
            "audit_scores_are_priors_not_hard_routing_truth",
            "no_single_universal_layer",
            '"training_authorized": False',
            '"scale_authorized": False',
            '"hard_parameter_ceiling"',
          ]
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit("layer-map compiler contract missing "+repr(missing))
          forbidden=["torch.optim","backward(","optimizer.step"]
          present=[x for x in forbidden if x in t]
          if present: raise SystemExit("training leaked into layer-map compiler "+repr(present))
          print("layer_map_compiler_governance=PASS")
          PY

      - name: Multi-layer interface architecture
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path("src/alice_personality/n0/relation_conditioned_multilayer_query.py").read_text()
          required=[
            "RelationConditionedMultiLayerQueryInterface",
            "relation_layer_candidate_mask",
            "relation_layer_audit_prior",
            "relation_embedding",
            "token_scores = torch.einsum",
            "layer_weights",
            "edge_relation_query_state",
            "candidate_layer_mask_is_permanent_architecture_limit",
            "single_universal_layer",
            '"hard_parameter_ceiling": None',
            "EvidenceRelationType.CONFLICTS_WITH",
          ]
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit("interface architecture contract missing "+repr(missing))
          forbidden=[
            "layer_index = 12",
            "final_hidden_state",
            "query_projection(query_semantic)",
          ]
          present=[x for x in forbidden if x in t]
          if present: raise SystemExit("universal/final-layer shortcut leaked "+repr(present))
          print("multilayer_interface_architecture=PASS")
          PY

      - name: Exact 575804 map binding
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          compile_runner=Path(
              "scripts/eipm/n0/run_n0_v02_compile_relation_conditioned_layer_map_v0_1.sh"
          ).read_text()
          qualify_runner=Path(
              "scripts/eipm/n0/run_n0_v02_qualify_relation_conditioned_multilayer_interface_v0_1.sh"
          ).read_text()
          required_compile=[
            "ee88e80513fb000e2ecde8ca9e4f7e714cb06e43a144bd28c8930d26c38965ab",
            "COMPLETE_NO_GRADIENT_LAYERWISE_RELATION_SEMANTICS_AUDIT",
            "gradient_performed",
            "model_parameters_mutated",
            "scale_authorized",
            "training_authorized",
          ]
          missing=[x for x in required_compile if x not in compile_runner]
          if missing: raise SystemExit("575804 compile binding missing "+repr(missing))
          required_qualify=[
            "ac0e5e28749cbb1e8dda62262c4c2761db887b965cbc3a74493ff6c9b5355304",
            "ee88e80513fb000e2ecde8ca9e4f7e714cb06e43a144bd28c8930d26c38965ab",
            "RUNTIME QUALIFICATION",
            "gradient_performed=false",
            "optimizer_created=false",
            "gpu_required=false",
            "training_authorized=false",
            "scale_authorized=false",
          ]
          missing=[x for x in required_qualify if x not in qualify_runner]
          if missing: raise SystemExit("exact-map qualification binding missing "+repr(missing))
          forbidden=["sbatch","git pull","git checkout","git switch"]
          for name,text in (("compile",compile_runner),("qualify",qualify_runner)):
              present=[x for x in forbidden if x in text]
              if present:
                  raise SystemExit(f"{name} runner leaked scheduler/branch mutation "+repr(present))
          print("exact_map_binding=PASS")
          PY

      - name: Runtime qualification governance
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path(
              "scripts/eipm/n0/qualify_n0_v02_relation_conditioned_multilayer_interface_v0_1.py"
          ).read_text()
          required=[
            "PASS_EXACT_MAP_NO_GRADIENT_RUNTIME_CONTRACT",
            "RelationConditionedMultiLayerQueryInterface.from_layer_map_file",
            "tensor_state_sha256",
            "parameter_state_exactly_unchanged",
            "symmetric_conflicts_with_fails_closed",
            "pad_fails_closed",
            "heldout_rows_used",
            "frozen_challenge_rows_used",
            "private_identity_data_used",
            '"training_authorized": False',
            '"scale_authorized": False',
            '"heldout_opening_authorized": False',
            '"frozen_challenge_rerun_authorized": False',
            '"n0_complete": False',
          ]
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit("runtime qualification contract missing "+repr(missing))
          forbidden=[
            "torch.optim",
            ".backward(",
            "optimizer.step",
            "cuda()",
            'torch.device("cuda")',
            "subprocess.run([\"sbatch",
          ]
          present=[x for x in forbidden if x in t]
          if present: raise SystemExit("training/GPU leaked into runtime qualification "+repr(present))
          print("runtime_qualification_governance=PASS")
          PY

      - name: Current state forbids training
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(
              Path("configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.18.json").read_text()
          )
          e=s["execution_policy"]
          if e["runtime_qualification_authorized"] is not True:
              raise SystemExit("runtime qualification not authorized")
          if e["runtime_qualification_gpu_required"] is not False:
              raise SystemExit("CPU-only qualification drift")
          for key in (
              "training_authorized",
              "optimizer_authorized",
              "gradient_authorized",
              "new_gpu_run_authorized",
              "scale_authorized",
              "heldout_opening_authorized",
              "frozen_challenge_rerun_authorized",
          ):
              if e[key] is not False:
                  raise SystemExit(f"{key} authorized prematurely")
          if s["map_inspection"]["single_universal_layer"] is not False:
              raise SystemExit("universal layer hardcoded")
          if s["architecture_v0_1"]["hard_parameter_ceiling"] is not None:
              raise SystemExit("hard ceiling reintroduced")
          if s["capability_policy"]["hard_parameter_ceiling"] is not None:
              raise SystemExit("capability ceiling reintroduced")
          if s["n0_complete"] is not False:
              raise SystemExit("N0 completion drift")
          if s["preserved_evidence"]["compiled_layer_map_sha256"] != (
              "ac0e5e28749cbb1e8dda62262c4c2761db887b965cbc3a74493ff6c9b5355304"
          ):
              raise SystemExit("compiled map receipt drift")
          w=Path("scripts/eipm/n0/magnolia_udocker_exec.sh").read_text()
          required_wrapper=[
              '--env="ALICE_REPO_ROOT=$ROOT"',
              'ALICE_N0_MULTILAYER_INTERFACE_DIR',
          ]
          missing=[x for x in required_wrapper if x not in w]
          if missing:
              raise SystemExit("Magnolia udocker root/output binding missing "+repr(missing))
          print("state_training_freeze=PASS")
          PY

      - name: Causal curriculum and preservation design
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          python scripts/eipm/n0/build_n0_v02_relation_conditioned_multilayer_interface_curriculum_v0_1.py \
            --output "$TMP/curriculum.jsonl" \
            --manifest "$TMP/manifest.json"
          python - "$TMP/manifest.json" "$TMP/curriculum.jsonl" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          manifest=Path(sys.argv[1]); curriculum=Path(sys.argv[2])
          m=json.loads(manifest.read_text())
          if m["schema"]!="alice.eipm.n0.v02-relation-conditioned-multilayer-interface-curriculum.v0.1":
              raise SystemExit("causal curriculum schema drift")
          if m["rows"]!=720 or m["quad_count"]!=180:
              raise SystemExit("causal curriculum size drift")
          if m["relations"]!=["corrects","supersedes","derived_from","causes","supports","temporal_successor"]:
              raise SystemExit("causal relation coverage drift")
          if m["factorial_design"]["target_must_flip_with_query_role"] is not True:
              raise SystemExit("query-role causal control missing")
          if m["factorial_design"]["target_must_flip_with_edge_direction"] is not True:
              raise SystemExit("edge-direction causal control missing")
          for key in (
              "interface_training_authorized",
              "optimizer_authorized",
              "gradient_authorized",
              "dev_split_training_authorized",
              "test_split_training_authorized",
              "test_split_opening_authorized",
          ):
              if m[key] is not False:
                  raise SystemExit(f"{key} authorized prematurely")
          actual=hashlib.sha256(curriculum.read_bytes()).hexdigest()
          if m["compiled_sha256"]!=actual:
              raise SystemExit("compiled curriculum hash drift")
          print("causal_curriculum_contract=PASS")
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path(
              "configs/eipm/n0/n0_v02_relation_conditioned_multilayer_preservation_contract_v0_1.json"
          ).read_text())
          if p["lineage"]["runtime_qualification_receipt_sha256"] != (
              "779b19459fa8ab67bb1c3ed56b3e9cdb1b89b8382f145e1b3d7c4d98312b2b57"
          ):
              raise SystemExit("runtime qualification lineage drift")
          if p["lineage"]["selected_parent_graph_sha256"] != (
              "3ae08aa2fc2c46ed74a47792310c6c2bf202fad800549cecc36c5365523dc47f"
          ):
              raise SystemExit("parent graph lineage drift")
          if p["numerical_tolerance_policy"]["candidate_result_may_not_define_tolerances"] is not True:
              raise SystemExit("candidate-dependent tolerances leaked")
          if p["numerical_tolerance_policy"]["tolerances_must_be_frozen_before_candidate_training"] is not True:
              raise SystemExit("pre-candidate tolerance freeze missing")
          for key in ("training_authorized","optimizer_authorized","gradient_authorized","new_gpu_run_authorized"):
              if p[key] is not False:
                  raise SystemExit(f"{key} authorized prematurely")
          print("preservation_contract=PASS")
          PY
          python - <<'PY'
          from pathlib import Path
          t=Path(
              "scripts/eipm/n0/run_n0_v02_prepare_relation_conditioned_multilayer_causal_study_v0_1.sh"
          ).read_text()
          required=[
              "779b19459fa8ab67bb1c3ed56b3e9cdb1b89b8382f145e1b3d7c4d98312b2b57",
              "ac0e5e28749cbb1e8dda62262c4c2761db887b965cbc3a74493ff6c9b5355304",
              "3ae08aa2fc2c46ed74a47792310c6c2bf202fad800549cecc36c5365523dc47f",
              "PASS_CAUSAL_STUDY_INPUTS_FROZEN_TRAINING_DECISION_STILL_REQUIRED",
              '"interface_training_authorized": False',
              '"optimizer_authorized": False',
              '"gradient_authorized": False',
              '"new_gpu_run_authorized": False',
          ]
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit("causal preparation contract missing "+repr(missing))
          forbidden=["sbatch","torch.optim",".backward(","optimizer.step","git pull","git checkout","git switch"]
          present=[x for x in forbidden if x in t]
          if present: raise SystemExit("training/scheduler mutation leaked into CPU preparation "+repr(present))
          print("causal_preparation_governance=PASS")
          PY

      - name: Current causal-study state forbids training
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(
              Path("configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.19.json").read_text()
          )
          if s["runtime_qualification"]["status"] != "PASS_EXACT_MAP_NO_GRADIENT_RUNTIME_CONTRACT":
              raise SystemExit("runtime qualification state drift")
          if s["runtime_qualification"]["receipt_sha256"] != (
              "779b19459fa8ab67bb1c3ed56b3e9cdb1b89b8382f145e1b3d7c4d98312b2b57"
          ):
              raise SystemExit("runtime qualification receipt drift")
          if s["causal_curriculum_v0_1"]["rows"] != 720 or s["causal_curriculum_v0_1"]["quads"] != 180:
              raise SystemExit("causal curriculum state drift")
          if s["causal_study_preparation"]["preparation_authorized"] is not True:
              raise SystemExit("CPU preparation not authorized")
          e=s["execution_policy"]
          if e["cpu_preparation_authorized"] is not True:
              raise SystemExit("CPU preparation execution drift")
          for key in (
              "training_authorized",
              "optimizer_authorized",
              "gradient_authorized",
              "new_gpu_run_authorized",
              "scale_authorized",
              "heldout_opening_authorized",
              "frozen_challenge_rerun_authorized",
              "semantic_retraining_authorized",
              "graph_parent_retraining_authorized",
              "private_identity_gradient_authorized",
              "production_promotion_authorized",
          ):
              if e[key] is not False:
                  raise SystemExit(f"{key} authorized prematurely")
          if s["capability_policy"]["hard_parameter_ceiling"] is not None:
              raise SystemExit("hard capability ceiling reintroduced")
          if s["n0_complete"] is not False:
              raise SystemExit("N0 completion drift")
          w=Path("scripts/eipm/n0/magnolia_udocker_exec.sh").read_text()
          for required in (
              '--env="ALICE_REPO_ROOT=$ROOT"',
              'ALICE_N0_MULTILAYER_INTERFACE_DIR',
              'ALICE_N0_MULTILAYER_CAUSAL_STUDY_DIR',
          ):
              if required not in w:
                  raise SystemExit("Magnolia udocker causal-study binding missing "+required)
          print("causal_study_state_training_freeze=PASS")
          PY


      - name: Frozen-parent multilayer integration
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path("src/alice_personality/n0/evidence_graph_multilayer_interface.py").read_text()
          required=[
            "RelationConditionedMultiLayerEvidenceGraphEncoder",
            "edge_relation_query_state",
            "interface_endpoint_read",
            "nn.init.zeros_",
            "parent_relation_status_bias",
            "interface_relation_status_bias",
            "freeze_parent_for_interface_training",
            '"generic_endpoint_router": False',
            '"raw_mean_pool_router": False',
            '"hardcoded_single_layer": False',
            '"hard_parameter_ceiling": None',
          ]
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit("multilayer integration contract missing "+repr(missing))
          forbidden=[
            "semantic_role_delta_mlp",
            "semantic_role_query_adapter",
            "semantic_router_role_logits",
            "layer_index = 12",
          ]
          present=[x for x in forbidden if x in t]
          if present: raise SystemExit("old router/residual shortcut leaked "+repr(present))
          print("frozen_parent_multilayer_integration=PASS")
          PY

      - name: Parent-only preservation calibration gate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path("scripts/eipm/n0/calibrate_n0_v02_multilayer_preservation_v0_1.py").read_text()
          required=[
            "canonical_parent_repeatability_only",
            "candidate_result_observed",
            "PASS_PARENT_ONLY_PRESERVATION_CALIBRATION",
            "interface_training_gate_satisfied",
            "ABSOLUTE_FLOOR = 1e-6",
            "REPEATABILITY_MULTIPLIER = 2.0",
            "torch.device(\"cpu\")",
            '"gpu_required": False',
          ]
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit("parent-only calibration contract missing "+repr(missing))
          forbidden=[
            "torch.optim",
            ".backward(",
            "optimizer.step",
            'torch.device("cuda")',
            "candidate_path",
            "candidate_checkpoint",
          ]
          present=[x for x in forbidden if x in t]
          if present: raise SystemExit("candidate/training leaked into calibration "+repr(present))
          r=Path("scripts/eipm/n0/run_n0_v02_calibrate_multilayer_preservation_v0_1.sh").read_text()
          for required_hash in (
              "54dc915f10ee58d994e387ca59ab1180f96bd0e3523780f3e75fb14d6ac30690",
              "65b3fa76487fef346ef227dc77ed57da504e2dcf891e32416ce60ef5a6df99dd",
              "3ae08aa2fc2c46ed74a47792310c6c2bf202fad800549cecc36c5365523dc47f",
          ):
              if required_hash not in r:
                  raise SystemExit("calibration runner missing frozen hash "+required_hash)
          if "sbatch" in r:
              raise SystemExit("CPU calibration runner may not submit GPU work")
          print("parent_only_preservation_calibration_gate=PASS")
          PY

      - name: One bounded training decision
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path(
              "configs/eipm/n0/n0_v02_relation_conditioned_multilayer_training_decision_v0_1.json"
          ).read_text())
          if d["decision"]!="AUTHORIZE_ONE_BOUNDED_INTERFACE_EXPERIMENT_AFTER_PARENT_ONLY_CALIBRATION":
              raise SystemExit("training decision drift")
          if d["execution_scope"]["maximum_bounded_training_runs_authorized"]!=1:
              raise SystemExit("training run count drift")
          for key in (
              "automatic_rerun_authorized",
              "automatic_hotfix_authorized",
              "automatic_test_opening_authorized",
              "automatic_frozen_challenge_rerun_authorized",
              "automatic_scale_authorized",
              "semantic_retraining_authorized",
              "graph_parent_retraining_authorized",
              "production_promotion_authorized",
              "n0_complete",
          ):
              if d["execution_scope"][key] is not False:
                  raise SystemExit(f"decision governance drift: {key}")
          if d["gradient_data_policy"]["fresh_causal_train_rows_only"] is not True:
              raise SystemExit("gradient data scope drift")
          for key in (
              "ordinary_preservation_rows_used_for_gradient",
              "endpoint_preservation_rows_used_for_gradient",
              "causal_test_rows_used_for_gradient",
              "frozen_challenge_rows_used_for_gradient",
              "private_identity_data_used_for_gradient",
          ):
              if d["gradient_data_policy"][key] is not False:
                  raise SystemExit(f"forbidden gradient data leaked: {key}")
          if d["trainable_scope"]["hard_parameter_ceiling"] is not None:
              raise SystemExit("hard parameter ceiling reintroduced")
          print("one_bounded_training_decision=PASS")
          PY

      - name: Bounded trainer governance
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path(
              "scripts/eipm/n0/train_n0_v02_relation_conditioned_multilayer_interface_v0_1.py"
          ).read_text()
          required=[
            "RelationConditionedMultiLayerEvidenceGraphEncoder",
            "RelationConditionedMultiLayerQueryInterface.from_layer_map_file",
            "freeze_parent_for_interface_training",
            "PASS_PARENT_ONLY_PRESERVATION_CALIBRATION",
            "candidate_result_observed",
            "preservation_rows_used_for_gradient",
            "TARGET_RELATIONS = (\"causes\", \"supports\")",
            "test_split_evaluated",
            "test_split_opened_after_training",
            "automatic_rerun_or_hotfix_authorized",
            "parent_graph_parameters_exactly_unchanged",
            "eligible_for_heldout_decision",
          ]
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit("bounded trainer contract missing "+repr(missing))
          forbidden=[
            "QRR",
            "query_relation_role_router",
            "semantic_role_delta_mlp",
            "semantic_role_query_adapter",
            "semantic_heldout_test_metrics",
            "frozen_challenge",
          ]
          # frozen_challenge is allowed only in explicit false governance strings.
          present=[x for x in forbidden[:-1] if x in t]
          if present: raise SystemExit("old repair architecture leaked into trainer "+repr(present))
          if 'frozen_challenge_evaluated": False' not in t:
              raise SystemExit("frozen challenge false governance missing")
          if 'test_split_evaluated": False' not in t:
              raise SystemExit("test split false governance missing")
          runner=Path(
              "scripts/eipm/n0/run_n0_v02_relation_conditioned_multilayer_interface_v0_1.sh"
          ).read_text()
          if "preservation_calibration_training_gate=PASS" not in runner:
              raise SystemExit("training runner does not require calibration gate")
          if "--max-steps 160" not in runner:
              raise SystemExit("bounded training step contract drift")
          if "heldout_opening_authorized=false" not in runner:
              raise SystemExit("runner heldout governance missing")
          print("bounded_trainer_governance=PASS")
          PY
