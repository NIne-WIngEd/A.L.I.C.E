name: N0 Setwise Edge Router Training Contract Check

on:
  push:
    branches:
      - alice-eipm-v1-query-edge-setwise-router
    paths:
      - "scripts/eipm/n0/train_n0_v02_query_edge_setwise_router_v0_1.py"
      - "scripts/eipm/n0/run_n0_v02_query_edge_setwise_router_training_v0_1.sh"
      - "scripts/eipm/n0/magnolia_p100_n0_v02_query_edge_setwise_router_training_v0_1.sbatch"
      - "configs/eipm/n0/n0_v02_setwise_edge_router_training_decision_v0_1.json"
      - "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.30.json"
      - ".github/workflows/n0-setwise-edge-router-training-contract-check.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax
        run: |
          set -euo pipefail
          python -m py_compile scripts/eipm/n0/train_n0_v02_query_edge_setwise_router_v0_1.py
          bash -n scripts/eipm/n0/run_n0_v02_query_edge_setwise_router_training_v0_1.sh
          bash -n scripts/eipm/n0/magnolia_p100_n0_v02_query_edge_setwise_router_training_v0_1.sbatch

      - name: Qualification and one-run isolation are exact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          d=json.loads(Path(
              "configs/eipm/n0/n0_v02_setwise_edge_router_training_decision_v0_1.json"
          ).read_text())
          s=json.loads(Path(
              "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.30.json"
          ).read_text())

          if d["qualification"]["receipt_sha256"]!="4b1591e1eec5c450a872264a1bdf1130def5a29e443c8c35e974ae05f2861666":
              raise SystemExit("setwise qualification receipt drift")
          if d["qualification"]["source_revision"]!="7a8bc6b63a9f32095ba3fe4ed27db5f62cf5e061":
              raise SystemExit("setwise qualification source drift")
          if d["source_failure"]["result_sha256"]!="08bef659779c2e6fcfb0d60ef209d9f6c7f03b0198bcf370e097e278f5436328":
              raise SystemExit("failed competitive result drift")
          if d["decision"]!="AUTHORIZE_ONE_BOUNDED_SETWISE_EDGE_ROUTER_EXPERIMENT_AFTER_RUNTIME_QUALIFICATION":
              raise SystemExit("training decision drift")
          if d["operating_budget"]["max_training_runs"]!=1:
              raise SystemExit("one-run boundary drift")

          q=d["qualification"]
          for key in (
              "parent_parameters_exactly_unchanged",
              "exact_parent_field_weights",
              "exact_parent_pooled_state",
              "route_probabilities_sum_to_one",
              "explicit_parent_noop_route",
              "all_active_directed_edges_jointly_contextualized",
              "edge_set_permutation_equivariance",
              "nonlocal_competitor_context",
              "route_probability_is_actual_source_contribution_control",
              "route_probability_is_actual_target_contribution_control",
          ):
              if q[key] is not True:
                  raise SystemExit(f"qualification invariant drift: {key}")
          if q["independent_per_edge_route_scoring"] is not False:
              raise SystemExit("independent route scoring returned")
          if q["proxy_dot_product_router"] is not False:
              raise SystemExit("proxy router returned")

          iso=d["experimental_isolation"]
          for key in (
              "same_query_edge_training_curriculum",
              "same_preservation_train_anchors",
              "same_frozen_parent_graph",
              "same_frozen_parent_adapter",
              "same_direct_runtime_route_supervision",
              "same_parent_noop_supervision",
              "same_parent_distillation",
              "same_training_step_budget",
              "same_optimizer_hyperparameters",
              "same_checkpoint_eligibility_policy",
          ):
              if iso[key] is not True:
                  raise SystemExit(f"architecture-isolation drift: {key}")

          obj=d["training_objective"]
          if obj["loss_weight_change_from_failed_competitive_run"] is not False:
              raise SystemExit("loss weights changed")
          for key in (
              "proxy_routing_loss",
              "irrelevant_edge_gate_penalty",
              "load_balancing_loss",
              "gradient_surgery",
              "route_probability_detachment",
          ):
              if obj[key] is not False:
                  raise SystemExit(f"unreviewed mechanism entered objective: {key}")

          if s["schema"]!="alice.eipm.n0.latent-pool-stage-state.v0.30":
              raise SystemExit("v0.30 schema drift")
          e=s["execution_policy"]
          if e["gpu_training_runs_remaining"]!=1:
              raise SystemExit("GPU run-count drift")
          if e["gradient_execution_authorized_now"] is not True:
              raise SystemExit("gradient not authorized")
          if e["gpu_execution_authorized_now"] is not True:
              raise SystemExit("GPU not authorized")
          for key in (
              "automatic_rerun_authorized",
              "automatic_hotfix_authorized",
              "automatic_heldout_opening_authorized",
              "heldout_opening_authorized",
              "frozen_challenge_rerun_authorized",
              "scale_authorized",
              "semantic_retraining_authorized",
              "graph_parent_retraining_authorized",
              "private_identity_gradient_authorized",
              "production_promotion_authorized",
          ):
              if e[key] is not False:
                  raise SystemExit(f"premature authorization: {key}")
          if s["n0_complete"] is not False:
              raise SystemExit("N0 completion drift")
          print("exact_setwise_qualification_and_one_run_isolation=PASS")
          PY

      - name: Trainer uses exact setwise runtime route and frozen parent
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path(
              "scripts/eipm/n0/train_n0_v02_query_edge_setwise_router_v0_1.py"
          ).read_text()

          required=[
              "SetwiseQueryEdgeEvidenceGraphEncoder",
              "SetwiseQueryEdgeBridge",
              'return batch["relevant_edge_index"].long() + 1',
              'F.cross_entropy(out["route_logits_with_noop"], route_targets(batch))',
              'route_prob = out["route_probabilities_with_noop"]',
              'route_pred = route_prob.argmax(dim=-1)',
              "freeze_parent_for_bridge_training",
              'exclude_prefixes=("setwise_query_edge_bridge.",)',
              'if name.startswith("setwise_query_edge_bridge.")',
              '"setwise_query_edge_bridge_only"',
              '"proxy_routing_loss": False',
              '"irrelevant_edge_gate_penalty": False',
              '"load_balancing_loss": False',
              '"gradient_surgery": False',
              '"route_probability_detachment": False',
          ]
          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit("setwise trainer contract missing "+repr(missing))

          forbidden=[
              "CompetitiveQueryEdgeEvidenceGraphEncoder",
              "competitive_query_edge_bridge.",
              "edge_specialist_gate",
              "PCGrad",
              "project_conflicting",
          ]
          present=[x for x in forbidden if x in t]
          if present:
              raise SystemExit("rejected mechanism leaked "+repr(present))
          print("exact_setwise_runtime_route_and_frozen_parent=PASS")
          PY

      - name: Trainer retains direct no-op preservation and readiness gate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path(
              "scripts/eipm/n0/train_n0_v02_query_edge_setwise_router_v0_1.py"
          ).read_text()
          required=[
              "def noop_route_loss",
              "targets = torch.zeros(",
              'F.cross_entropy(out["route_logits_with_noop"], targets)',
              'anchors["ordinary"]["train_anchor_ids"]',
              'anchors["endpoint"]["train_anchor_ids"]',
              "teacher = old.parent_forward(baseline_graph, adapter, preserve)",
              'old.distill_kl(',
              '0.5 * args.preservation_weight * kl',
              '0.5 * args.noop_route_weight * noop_ce',
              'float(current["routing_accuracy"]) > 0.5',
              'float(current["family_min_routing_accuracy"]) > 0.2 + 1e-12',
              '"preservation_dev_rows_used_for_gradient": False',
              '"causal_test_split_evaluated": False',
              '"frozen_challenge_evaluated": False',
              '"automatic_rerun_or_hotfix_authorized": False',
              '"heldout_opening_authorized": False',
              '"scale_authorized": False',
          ]
          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit("no-op preservation/readiness contract missing "+repr(missing))
          print("direct_noop_preservation_and_readiness_gate=PASS")
          PY

      - name: Runner binds exact runtime evidence and unchanged objective
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          r=Path(
              "scripts/eipm/n0/run_n0_v02_query_edge_setwise_router_training_v0_1.sh"
          ).read_text()
          required=[
              "4b1591e1eec5c450a872264a1bdf1130def5a29e443c8c35e974ae05f2861666",
              "08bef659779c2e6fcfb0d60ef209d9f6c7f03b0198bcf370e097e278f5436328",
              "c3618a6022519af2a6a140f8b571281c68735fd1412c3ffa904979e9bbea2dcb",
              "0d05f1dcd7d11cc1defdd0a4112c10e3b1d7febfaabf97fe611a854d6905b99a",
              "f5b3f438f776216f6dbd557a8c785aac70af38d256e3f7cf94f0f71a43f53e94",
              "3ae08aa2fc2c46ed74a47792310c6c2bf202fad800549cecc36c5365523dc47f",
              "50eeeea3dfff5b6bddaa8da667b6b6c2f917dc668b1acd0410923822ae5ad2df",
              "setwise_router_one_p100_training_gate=PASS",
              'mkdir "$TRAIN_ROOT"',
              "--max-steps 200",
              "--learning-rate 0.00015",
              "--causal-route-weight 1.0",
              "--preservation-weight 1.0",
              "--noop-route-weight 1.0",
              "loss_weights_changed_from_failed_competitive_run=false",
              "optimizer_hyperparameters_changed_from_failed_competitive_run=false",
          ]
          missing=[x for x in required if x not in r]
          if missing:
              raise SystemExit("runner exact binding missing "+repr(missing))
          print("runner_exact_evidence_and_unchanged_objective=PASS")
          PY

      - name: P100 wrapper is bounded
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path(
              "scripts/eipm/n0/magnolia_p100_n0_v02_query_edge_setwise_router_training_v0_1.sbatch"
          ).read_text()
          required=[
              "#SBATCH --gres=gpu:p100:1",
              "#SBATCH --nodes=1",
              "#SBATCH --ntasks=1",
              "#SBATCH --time=01:30:00",
              "RAYAN_UDOCKER_NVIDIA=1",
              "Expected P100",
              "run_n0_v02_query_edge_setwise_router_training_v0_1.sh",
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit("P100 wrapper drift "+repr(missing))
          print("bounded_setwise_router_p100_wrapper=PASS")
          PY
