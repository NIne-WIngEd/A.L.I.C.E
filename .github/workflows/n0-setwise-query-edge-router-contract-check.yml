name: N0 Setwise Query Edge Router Contract Check

on:
  push:
    branches:
      - alice-eipm-v1-query-edge-setwise-router
    paths:
      - "src/alice_personality/n0/query_edge_setwise_router_bridge.py"
      - "src/alice_personality/n0/evidence_graph_query_edge_setwise_router.py"
      - "scripts/eipm/n0/qualify_n0_v02_query_edge_setwise_router_v0_1.py"
      - "scripts/eipm/n0/run_n0_v02_qualify_query_edge_setwise_router_v0_1.sh"
      - "configs/eipm/n0/n0_v02_query_edge_setwise_router_design_decision_v0_1.json"
      - "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.29.json"
      - ".github/workflows/n0-setwise-query-edge-router-contract-check.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax
        run: |
          set -euo pipefail
          python -m py_compile \
            src/alice_personality/n0/query_edge_setwise_router_bridge.py \
            src/alice_personality/n0/evidence_graph_query_edge_setwise_router.py \
            scripts/eipm/n0/qualify_n0_v02_query_edge_setwise_router_v0_1.py
          bash -n scripts/eipm/n0/run_n0_v02_qualify_query_edge_setwise_router_v0_1.sh

      - name: Failure is bound and no training is authorized
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          d=json.loads(Path(
              "configs/eipm/n0/n0_v02_query_edge_setwise_router_design_decision_v0_1.json"
          ).read_text())
          s=json.loads(Path(
              "configs/eipm/n0/alice_n0_latent_pool_stage_state_v0.29.json"
          ).read_text())

          expected="08bef659779c2e6fcfb0d60ef209d9f6c7f03b0198bcf370e097e278f5436328"
          if d["source_failure"]["result_sha256"]!=expected:
              raise SystemExit("source failure hash drift")
          if s["source_failure"]["result_sha256"]!=expected:
              raise SystemExit("stage source failure hash drift")
          if d["source_failure"]["selected_checkpoint"] is not None:
              raise SystemExit("failed run unexpectedly selected checkpoint")
          if d["source_failure"]["eligible_checkpoint_keys"]!=[]:
              raise SystemExit("failed run unexpectedly has eligible checkpoint")

          if d["decision"]!="AUTHORIZE_SETWISE_CONTEXTUAL_ROUTER_IMPLEMENTATION_AND_CPU_NO_GRADIENT_QUALIFICATION_ONLY":
              raise SystemExit("design decision drift")
          e=s["execution_policy"]
          if e["cpu_no_gradient_runtime_qualification_authorized"] is not True:
              raise SystemExit("CPU qualification not authorized")
          for key in (
              "optimizer_authorized",
              "gradient_authorized",
              "gpu_training_authorized",
              "automatic_rerun_authorized",
              "automatic_hotfix_authorized",
              "heldout_opening_authorized",
              "frozen_challenge_rerun_authorized",
              "scale_authorized",
              "semantic_retraining_authorized",
              "graph_parent_retraining_authorized",
              "private_identity_gradient_authorized",
              "production_promotion_authorized",
          ):
              if e[key] is not False:
                  raise SystemExit(f"premature authorization: {key}")
          if s["n0_complete"] is not False:
              raise SystemExit("N0 completion drift")
          print("failure_binding_and_no_training_authorization=PASS")
          PY

      - name: Router is genuinely setwise rather than softmax-only competition
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          b=Path(
              "src/alice_personality/n0/query_edge_setwise_router_bridge.py"
          ).read_text()
          required=[
              "nn.TransformerEncoderLayer(",
              "self.route_set_encoder = nn.TransformerEncoder(",
              "route_nodes = torch.cat(",
              "src_key_padding_mask=route_padding_mask",
              "contextual_route_nodes",
              "self.noop_route_token",
              "self.global_query_projection",
              '"setwise_contextual_routing": True',
              '"joint_competitor_context": True',
              '"permutation_equivariant_edge_set": True',
              '"edge_order_positional_embedding": False',
              '"independent_per_edge_route_scoring": False',
          ]
          missing=[x for x in required if x not in b]
          if missing:
              raise SystemExit("setwise architecture contract missing "+repr(missing))

          forbidden=[
              "self.route_head =",
              "edge_position_embedding",
              "independent_per_edge_tanh_gate": True",
              "proxy_dot_product_router": True",
          ]
          present=[x for x in forbidden if x in b]
          if present:
              raise SystemExit("rejected routing mechanism returned "+repr(present))
          print("genuine_setwise_router_contract=PASS")
          PY

      - name: Parent-exact runtime control is retained
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          b=Path(
              "src/alice_personality/n0/query_edge_setwise_router_bridge.py"
          ).read_text()
          i=Path(
              "src/alice_personality/n0/evidence_graph_query_edge_setwise_router.py"
          ).read_text()

          required_bridge=[
              "nn.init.zeros_(self.source_residual_read.weight)",
              "nn.init.zeros_(self.target_residual_read.weight)",
              "source_residual = edge_route_probability * source_proposal",
              "target_residual = edge_route_probability * target_proposal",
              '"supervised_route_equals_runtime_contribution_route": True',
          ]
          required_integration=[
              "parent_relation_bias + bridge_bias",
              "setwise_query_edge_bridge.",
              "parent_graph_can_remain_frozen",
          ]
          missing=[x for x in required_bridge if x not in b]
          missing += [x for x in required_integration if x not in i]
          if missing:
              raise SystemExit("parent-exact runtime-control contract missing "+repr(missing))
          print("parent_exact_runtime_control=PASS")
          PY

      - name: Qualification proves permutation and nonlocal competitor context
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          q=Path(
              "scripts/eipm/n0/qualify_n0_v02_query_edge_setwise_router_v0_1.py"
          ).read_text()
          required=[
              "edge-set route permutation equivariance failed",
              "setwise router did not propagate competitor context across disjoint edges",
              '"edge_set_permutation_equivariance": True',
              '"nonlocal_competitor_context": True',
              '"route_probability_is_actual_source_contribution_control": True',
              '"route_probability_is_actual_target_contribution_control": True',
              '"optimizer_created": False',
              '"gradient_performed": False',
              '"gpu_required": False',
              '"training_authorized": False',
          ]
          missing=[x for x in required if x not in q]
          if missing:
              raise SystemExit("qualification proof contract missing "+repr(missing))
          print("qualification_proof_contract=PASS")
          PY

      - name: Runner binds immutable failure and forbids rerun
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          r=Path(
              "scripts/eipm/n0/run_n0_v02_qualify_query_edge_setwise_router_v0_1.sh"
          ).read_text()
          required=[
              "08bef659779c2e6fcfb0d60ef209d9f6c7f03b0198bcf370e097e278f5436328",
              "3ae08aa2fc2c46ed74a47792310c6c2bf202fad800549cecc36c5365523dc47f",
              "c3618a6022519af2a6a140f8b571281c68735fd1412c3ffa904979e9bbea2dcb",
              "0d05f1dcd7d11cc1defdd0a4112c10e3b1d7febfaabf97fe611a854d6905b99a",
              "f5b3f438f776216f6dbd557a8c785aac70af38d256e3f7cf94f0f71a43f53e94",
              "Preserve existing evidence; do not delete to rerun.",
          ]
          missing=[x for x in required if x not in r]
          if missing:
              raise SystemExit("runner immutable binding missing "+repr(missing))
          print("runner_immutable_binding=PASS")
          PY
