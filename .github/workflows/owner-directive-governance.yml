name: Owner directive governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-owner-directives:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate owner directives and product family
        run: |
          python scripts/validate_product_family.py
          python scripts/validate_owner_directives_v1.py
          python -m pytest \
            tests/governance/test_product_family.py \
            tests/governance/test_owner_directives.py \
            -q
