name: Phase 0 policy checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate constitutional and capability foundation
        run: |
          python scripts/validate_phase0.py
          python scripts/validate_governance_v1.py
          python scripts/validate_product_family.py
          python -m pytest tests/governance -q
      - name: Refuse new unscoped capability ceilings
        run: |
          if [ -z "$AUDIT_BASE" ] || echo "$AUDIT_BASE" | grep -Eq '^0+$'; then
            AUDIT_BASE="$(git rev-parse HEAD^)"
          fi
          python scripts/audit_capability_barriers.py             --repo .             --changed-only-against "$AUDIT_BASE"             --fail-on-unresolved
