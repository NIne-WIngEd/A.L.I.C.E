name: Phase 1 foundation tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            requirements-phase1.txt
            requirements-extraction.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-phase1.txt
          python -m pip install -r requirements-extraction.txt
      - name: Validate current governance
        run: |
          python scripts/validate_phase0.py
          python scripts/validate_governance_v1.py
          python scripts/audit_capability_barriers.py --repo . --fail-on-unresolved
      - name: Run active regression suites
        run: |
          python -m pytest tests/phase1 tests/phase2 tests/phase4 tests/governance -q
