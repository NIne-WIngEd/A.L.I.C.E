name: Product family architecture

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-product-family:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate A.L.I.C.E.–Friday architecture
        run: |
          python scripts/validate_product_family.py
          python -m pytest tests/governance/test_product_family.py -q
